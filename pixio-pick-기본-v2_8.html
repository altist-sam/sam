<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixio Pick!!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ff4200'/%3E%3Ctext x='32' y='47' font-family='Arial,Helvetica,sans-serif' font-size='44' font-weight='700' font-style='italic' text-anchor='middle' fill='%23fff'%3EP%3C/text%3E%3C/svg%3E">
<!--
====================================================================
  Pixio Pick!! — 게임·작업·예산 기반 모니터 추천 팝업  (Ver 3.4 / 단일 HTML)
  데이터 출처 : 픽시오 모니터 게임 작업 추천가이드 Ver2.7
                (적합도 매트릭스 / 추천 사양 / 홈페이지 문구 / 평가 기준 / 판매가 조사 / 구매 전 확인)
                (적합도 매트릭스 · 적합도 매트릭스(확장) · 스코어링 규칙 · 설문 문항 매핑 · 구매 전 확인 등)
                ※ Ver2.7의 '스코어링 규칙'(4단계 처리·동점 처리·표기 금지 규칙)과
                  '설문 문항 매핑'의 정합성 점검 C1·C3·C4 대체 처리를 반영했습니다.

  [변경 이력]
  · 2026-10-08 : 화면 크기 문항의 24인치·25인치를 「24~25인치」 한 선택지로 통합 (SIZE_GROUPS).
                 PX248(범용)과 Hayabusa(경쟁 게임)는 용도·게임 점수와 '중요하게 보는 점'으로 구분됩니다.
  · 2026-10-08 : PX32U를 예산 '70만 원 미만'부터 후보에 포함 (MODELS의 price.budgetFrom, budgetPrice 함수).
  · 2026-10-08 : 용도 점수 소수 오차로 1위와 정확히 0.5점 차이인 모델이 비슷한 후보에서 빠지던 문제 수정.

  [디자인]
  · pixiogaming.co.kr '제품 주문서'(pixio-order-form.html)와 동일한 디자인 언어를 사용합니다.
    직각 모서리 · 1px 검정 구역 테두리 · 포인트 컬러 #ff4200 · 국·영문 모두 Artific.
  · 폰트와 로고는 주문서 페이지와 같은 사내 서버 주소를 참조합니다.
    (연결이 안 되면 시스템 기본 글꼴과 텍스트 로고로 자동 대체됩니다.)

  [제품 이미지]
  · 결과 화면의 제품 사진은 storage.googleapis.com/pixio/img 의 공식 이미지를 참조합니다.
    주소를 바꾸려면 아래 MODELS 배열의 img 값을 교체하세요.
  · 2026-09-09 : 8종 전 주소의 접근 가능 여부를 확인했습니다. 확장자 대소문자가 모델마다 다르므로
    (.JPG 6종 / .jpg 2종) 주소를 옮겨 적으실 때 대소문자를 그대로 유지해 주세요.
  · 이미지를 불러오지 못하면 해당 사진 영역만 접히고 다른 제품 사진과 본문은 그대로 표시됩니다.

  [닫기 동작]
  · 결과를 보시다가 실수로 닫히지 않도록, 바깥 영역 클릭으로는 닫히지 않습니다.
    문항 화면은 Esc 로도 닫을 수 있고, 결과 화면은 오른쪽 위 × 버튼으로만 닫힙니다.

  [안내 원칙]
  · 시작 화면과 결과 하단에 '제품 선택을 돕기 위한 참고용 안내'임을 표기합니다.
  · 결과 화면에는 판매가를 표시하지 않습니다. 가격은 제품 상세페이지에서 확인하도록 안내합니다.

  [홈페이지 삽입 방법]
  1) 이 파일 하나만 업로드하면 동작합니다. (JS 라이브러리 의존 없음)
  2) 기존 페이지에 넣을 때는 <body> 안의
       <div id="pxp-root"> ... </div>  블록과
       <style id="pxp-style">, <script id="pxp-script">  3개만 복사하세요.
     모든 CSS는 #pxp-root 하위로 스코프되어 기존 홈페이지 스타일과 충돌하지 않습니다.
  3) 팝업 열기 : 아무 버튼에 onclick="PXP.open()" 또는 class="pxp-trigger" 부여
     팝업 닫기 : PXP.close()
  4) 자동 노출(첫 진입 3초 뒤 자동 오픈)은 스크립트 최하단 AUTO_OPEN 값을 true 로 변경.
  5) 제품 상세페이지 연결 : 아래 MODELS 배열의 url 값을 실제 주소로 교체.
  6) 개인정보 : 응답은 페이지 메모리에서만 다뤄지며 쿠키·localStorage·서버 전송을
     일절 사용하지 않습니다. 결과 산출 직후 응답 객체를 즉시 초기화합니다.
====================================================================
-->
<style id="pxp-style">
/* ==================================================================
   PIXIO PICK — 스타일
   pixiogaming.co.kr '제품 주문서' 페이지와 동일한 디자인 언어를 사용합니다.
   · 직각(모서리 반경 0) · 1px 검정 구역 테두리 · 포인트 컬러 #ff4200
   · 국·영문 모두 Artific (글리프가 없는 문자는 SUIT 로 자동 대체) · 회색 배경(#f4f4f5) 위 흰 카드
   모든 규칙은 #pxp-root 하위로만 적용되어 기존 페이지와 충돌하지 않습니다.
   ================================================================== */
@import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT.css');
/* Artific 을 국문까지 함께 사용합니다.
   문자 범위 제한(unicode-range)을 두지 않았으므로 한글도 Artific 으로 먼저 표시되고,
   Artific 에 해당 글자가 없을 때만 브라우저가 SUIT 로 자동 대체합니다. */
@font-face{
  font-family:'Artific';
  src:url('https://hameetoy.speedgabia.com/pixio/pixiogaming/common/font/Artific-Regular.woff2') format('woff2');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Artific';
  src:url('https://hameetoy.speedgabia.com/pixio/pixiogaming/common/font/Artific-Bold.woff2') format('woff2');
  font-weight:700; font-style:normal; font-display:swap;
}

#pxp-root, #pxp-root *, #pxp-root *::before, #pxp-root *::after { box-sizing: border-box; }
#pxp-root {
  --pxp-ink:#111;            /* 기본 텍스트 · 구역 테두리 */
  --pxp-point:#ff4200;       /* 포인트 레드 */
  --pxp-point-d:#e03900;     /* 포인트 눌림 */
  --pxp-mid:#9a9a9a;         /* 입력 · 보조 테두리 */
  --pxp-soft:#e2e2e2;        /* 내부 구분선 */
  --pxp-mute:#8a8a8a;
  --pxp-bg:#f4f4f5; --pxp-card:#fff; --pxp-head:#fafafa; --pxp-tint:#fff5f1;
  --pxp-wl:#d8a800; --pxp-wbg:#fff8e1; --pxp-wtx:#7a5f00;
  --pxp-l5:#ff4200; --pxp-l4:#111; --pxp-l3:#7a7a7a; --pxp-l2:#a9a9a9; --pxp-l1:#c8c8c8;
  font-family:'Artific','SUIT','SUIT Variable',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#pxp-root .pxp-overlay{
  position:fixed; inset:0; z-index:99999; display:none;
  background:rgba(0,0,0,.55); padding:22px 14px; overflow-y:auto;
}
#pxp-root .pxp-overlay.is-open{ display:block; animation:pxpFade .2s ease both; }
@keyframes pxpFade{from{opacity:0}to{opacity:1}}
@keyframes pxpUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pxpIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#pxp-root .pxp-modal{
  position:relative; width:100%; max-width:880px; margin:0 auto; background:var(--pxp-bg);
  border:1px solid var(--pxp-ink); border-radius:0; color:var(--pxp-ink);
  animation:pxpUp .26s cubic-bezier(.2,.7,.3,1) both; overflow:hidden;
  text-align:left; line-height:1.5; letter-spacing:-.2px;   /* 삽입 페이지의 정렬·행간 상속 차단 */
}
#pxp-root .pxp-modal::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--pxp-point); }
#pxp-root .pxp-x{
  position:absolute; top:16px; right:14px; width:32px; height:32px; border-radius:0;
  background:#fff; border:1px solid var(--pxp-ink); color:var(--pxp-ink);
  font-size:17px; line-height:1; cursor:pointer; font-family:inherit; transition:.12s; z-index:2;
}
#pxp-root .pxp-x:hover{ background:var(--pxp-ink); color:#fff; }
/* ---- 머리말 ---- */
#pxp-root .pxp-head{ padding:22px 24px 18px; border-bottom:1px solid var(--pxp-ink); background:#fff; }
#pxp-root .pxp-hrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-right:40px; }
#pxp-root .pxp-logo{ height:28px; width:auto; display:block; }
#pxp-root .pxp-brand-fb{ font-size:26px; font-weight:900; letter-spacing:-1px; font-style:italic; display:none; }
#pxp-root .pxp-brand-fb span{ font-style:normal; }
#pxp-root .pxp-doc{ font-size:28px; line-height:28px; font-weight:800; letter-spacing:-1.5px; font-style:italic; }
#pxp-root .pxp-doc em{ font-style:italic; color:var(--pxp-point); }
#pxp-root .pxp-title{ margin:16px 0 0; font-size:21px; font-weight:800; letter-spacing:-.8px; line-height:1.35; }
#pxp-root .pxp-title em{ font-style:normal; color:var(--pxp-point); }
#pxp-root .pxp-sub{ margin:7px 0 0; font-size:13px; color:var(--pxp-mute); line-height:1.6; }
#pxp-root .pxp-body{ padding:20px 24px 24px; display:grid; grid-template-columns:1fr 232px; gap:18px; align-items:start; background:var(--pxp-bg); }
#pxp-root .pxp-body.is-wide{ grid-template-columns:1fr; }
#pxp-root .pxp-main{ min-width:0; }
/* ---- 진행바 ---- */
#pxp-root .pxp-prog{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
#pxp-root .pxp-prog-bar{ flex:1; height:6px; background:var(--pxp-soft); border-radius:0; overflow:hidden; }
#pxp-root .pxp-prog-fill{ height:100%; width:0; background:var(--pxp-point); transition:width .35s cubic-bezier(.3,.8,.3,1); }
#pxp-root .pxp-prog-txt{ font-size:11.5px; font-weight:800; color:var(--pxp-mute); letter-spacing:0; white-space:nowrap; }
/* ---- 카드 · 구역 머리 (주문서 .card / .sec-head 와 동일) ---- */
#pxp-root .pxp-sheet{ background:var(--pxp-card); border:1px solid var(--pxp-ink); border-radius:0; }
#pxp-root .pxp-sec-head{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:13px 16px; border-bottom:1px solid var(--pxp-ink); background:var(--pxp-head); }
#pxp-root .pxp-sec-head h3{ margin:0; font-size:17px; font-weight:800; letter-spacing:-.5px; line-height:1.35; }
#pxp-root .pxp-sec-head .note{ flex:0 0 auto; font-size:12px; color:var(--pxp-mute); font-weight:500; text-align:right; line-height:1.4; }
#pxp-root .pxp-sec-body{ padding:16px; }
/* ---- 문항 ---- */
#pxp-root #pxpStage{ transition:opacity .17s ease, transform .17s ease; }
#pxp-root #pxpStage.is-out{ opacity:0; transform:translateY(-8px); }
#pxp-root .pxp-q{ animation:pxpIn .26s ease both; }
#pxp-root .pxp-opts{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
#pxp-root .pxp-opts.is-single{ grid-template-columns:1fr; }
#pxp-root .pxp-opt{
  position:relative; width:100%; text-align:left; padding:14px 15px; border-radius:0;
  background:#fff; border:1px solid var(--pxp-mid); color:var(--pxp-ink);
  cursor:pointer; font-family:inherit; transition:.12s;
}
#pxp-root .pxp-opt:hover{ border-color:var(--pxp-ink); }
#pxp-root .pxp-opt.is-sel{ border-color:var(--pxp-point); background:var(--pxp-tint); box-shadow:inset 0 0 0 1px var(--pxp-point); }
#pxp-root .pxp-opt-l{ display:flex; align-items:center; gap:10px; word-break:keep-all; font-size:14.5px; font-weight:700; letter-spacing:-.3px; }
#pxp-root .pxp-opt-l .pxp-chk{
  width:22px; height:22px; border-radius:0; border:1px solid var(--pxp-ink); background:#fff; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; line-height:1;
}
#pxp-root .pxp-opt.is-sel .pxp-chk{ background:var(--pxp-point); border-color:var(--pxp-point); }
#pxp-root .pxp-opt-d{ display:block; word-break:keep-all; margin-top:6px; padding-left:32px; font-size:12px; color:var(--pxp-mute); line-height:1.55; }
/* 선택이 끝난 뒤 남은 항목 — 흐리게 보이지만 눌러서 바꾸실 수 있습니다 */
#pxp-root .pxp-opt.is-dim{ background:#fafafa; border-color:#dedede; }
#pxp-root .pxp-opt.is-dim .pxp-opt-l{ color:#a6a6a6; }
#pxp-root .pxp-opt.is-dim .pxp-opt-d{ color:#c2c2c2; }
#pxp-root .pxp-opt.is-dim .pxp-chk{ border-color:#d2d2d2; }
#pxp-root .pxp-opt.is-dim:hover{ background:#fff; border-color:var(--pxp-ink); }
#pxp-root .pxp-opt.is-dim:hover .pxp-opt-l{ color:var(--pxp-ink); }
#pxp-root .pxp-opt.is-dim:hover .pxp-opt-d{ color:var(--pxp-mute); }
#pxp-root .pxp-opt.is-dim:hover .pxp-chk{ border-color:var(--pxp-ink); }
#pxp-root .pxp-nav{ display:flex; gap:10px; margin-top:16px; }
#pxp-root .pxp-btn{
  padding:15px 20px; border-radius:0; font-size:15.5px; font-weight:800; letter-spacing:-.4px; cursor:pointer;
  border:1px solid var(--pxp-ink); background:#fff; color:var(--pxp-ink); font-family:inherit; transition:.12s;
}
#pxp-root .pxp-btn:hover{ background:#efefef; }
#pxp-root .pxp-btn-main{ flex:1; border-color:var(--pxp-point); background:var(--pxp-point); color:#fff; }
#pxp-root .pxp-btn-main:hover{ background:var(--pxp-point-d); border-color:var(--pxp-point-d); color:#fff; }
#pxp-root .pxp-btn-main:disabled{ opacity:.45; cursor:not-allowed; background:var(--pxp-point); border-color:var(--pxp-point); }
#pxp-root .pxp-nav .pxp-btn:not(.pxp-btn-main){ flex:0 0 30%; }
/* ---- 선택 요약 ---- */
#pxp-root .pxp-side{ border:1px solid var(--pxp-ink); border-radius:0; background:var(--pxp-card); }
#pxp-root .pxp-side-t{ padding:13px 15px; border-bottom:1px solid var(--pxp-ink); background:var(--pxp-head);
  font-size:13.5px; font-weight:800; letter-spacing:-.4px; color:var(--pxp-ink); }
#pxp-root .pxp-sum{ list-style:none; margin:0; padding:6px 15px 10px; }
#pxp-root .pxp-sum li{ padding:7px 0; border-bottom:1px solid var(--pxp-soft); }
#pxp-root .pxp-sum li:last-child{ border-bottom:none; }
#pxp-root .pxp-sum .k{ display:flex; align-items:center; gap:7px; font-size:11px; color:var(--pxp-mute); font-weight:700; }
#pxp-root .pxp-sum .k i{ font-style:normal; width:16px; height:16px; border-radius:0; background:#fff; border:1px solid var(--pxp-mid);
  display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:800; color:var(--pxp-mute); flex:0 0 auto; }
#pxp-root .pxp-sum .v{ margin-top:4px; font-size:12.5px; font-weight:700; color:var(--pxp-ink); line-height:1.45; word-break:keep-all; }
#pxp-root .pxp-sum li.is-todo .v{ color:#c8c8c8; }
#pxp-root .pxp-sum li.is-now .k{ color:var(--pxp-point); }
#pxp-root .pxp-sum li.is-now .k i{ background:var(--pxp-point); border-color:var(--pxp-point); color:#fff; }
#pxp-root .pxp-sum li.is-done .k i{ background:var(--pxp-ink); border-color:var(--pxp-ink); color:#fff; }
#pxp-root .pxp-sum li.is-done{ cursor:pointer; }
#pxp-root .pxp-sum li.is-done:hover .v{ color:var(--pxp-point); }
/* ---- 분석 로딩 ---- */
#pxp-root .pxp-load{ padding:34px 20px 30px; text-align:center; animation:pxpIn .3s ease both; }
#pxp-root .pxp-wave{ display:flex; justify-content:center; align-items:flex-end; gap:1px;
  font-size:46px; font-weight:800; letter-spacing:-2px; line-height:1.1; height:64px; }
#pxp-root .pxp-wave i{ font-style:normal; display:inline-block; color:var(--pxp-ink);
  animation:pxpWave 1.5s cubic-bezier(.35,.1,.35,1) infinite;
  animation-delay:calc(var(--i) * .075s); }
#pxp-root .pxp-wave i.pt{ color:var(--pxp-point); }
#pxp-root .pxp-wave i.sp{ width:.28em; }
@keyframes pxpWave{ 0%,55%,100%{ transform:translateY(0) } 26%{ transform:translateY(-16px) } }
#pxp-root .pxp-lbar{ width:min(360px,86%); height:8px; margin:26px auto 0;
  background:var(--pxp-soft); border-radius:0; overflow:hidden; }
#pxp-root .pxp-lbar-f{ height:100%; width:0; background:var(--pxp-point); transition:width .12s linear; }
#pxp-root .pxp-lpct{ margin-top:11px; font-size:26px; font-weight:800; letter-spacing:-1.2px; color:var(--pxp-ink); }
#pxp-root .pxp-lpct span{ font-size:13px; font-weight:700; margin-left:1px; color:var(--pxp-point); }
#pxp-root .pxp-load-s{ font-size:12.5px; color:var(--pxp-mute); margin-top:8px; }
#pxp-root .pxp-steps{ list-style:none; margin:22px auto 0; padding:0; max-width:330px; text-align:left; }
#pxp-root .pxp-steps li{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:#bcbcbc; padding:5px 0; transition:color .3s ease; }
#pxp-root .pxp-steps li .pxp-dot{ width:14px; height:14px; border-radius:0; border:1px solid var(--pxp-mid); background:#fff; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; line-height:1; transition:.3s; }
#pxp-root .pxp-steps li.is-on{ color:var(--pxp-ink); font-weight:700; }
#pxp-root .pxp-steps li.is-on .pxp-dot{ border-color:var(--pxp-point); background:var(--pxp-tint); }
#pxp-root .pxp-steps li.is-done{ color:#6a6a6a; }
#pxp-root .pxp-steps li.is-done .pxp-dot{ background:var(--pxp-point); border-color:var(--pxp-point); }
#pxp-root .pxp-tick{ margin-top:16px; font-size:11.5px; color:var(--pxp-mute); height:16px; }
#pxp-root .pxp-tick b{ color:var(--pxp-ink); font-weight:800; }
/* ---- 결과 ---- */
#pxp-root .pxp-res{ animation:pxpIn .3s ease both; }

/* 대안 카드 */

#pxp-root .pxp-alt-cta{ display:block; margin-top:12px; padding:11px 10px; text-align:center;

#pxp-root .pxp-intro-i{ flex:0 0 18px; width:18px; height:18px; margin-top:2px; display:flex; align-items:center; justify-content:center;

#pxp-root .pxp-note strong{ color:var(--pxp-wtx); font-weight:800; }
#pxp-root .pxp-alt-t{ font-size:13.5px; font-weight:800; letter-spacing:-.4px; color:var(--pxp-ink);

#pxp-root .pxp-alts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; }
#pxp-root .pxp-alt{ display:flex; flex-direction:column; padding:15px 14px; border-radius:0; background:#fcfcfc; border:1px solid var(--pxp-mid); transition:.12s; }

#pxp-root .pxp-alt:hover{ border-color:var(--pxp-ink); }
#pxp-root .pxp-alt-n{ font-size:14.5px; font-weight:800; letter-spacing:-.4px; line-height:1.35; }
#pxp-root .pxp-alt-d{ margin-top:7px; font-size:11.8px; color:var(--pxp-mute); line-height:1.6; }
#pxp-root .pxp-alt-s{ margin-top:9px; font-size:11px; color:#8a8a8a; }
#pxp-root .pxp-cta{ display:flex; gap:10px; margin-top:16px; }
#pxp-root .pxp-cta a.pxp-btn-main{ flex:1; text-align:center; text-decoration:none; display:block; }
#pxp-root .pxp-cta .pxp-btn:not(.pxp-btn-main){ flex:0 0 34%; }
#pxp-root .pxp-foot{ margin-top:14px; font-size:11px; color:var(--pxp-mute); line-height:1.6; text-align:center; }
/* ---- 최대 선택 안내 ---- */
#pxp-root .pxp-hint{ margin-top:12px; font-size:12px; color:#5e4c10; background:var(--pxp-wbg); border:1px solid var(--pxp-wl);
  padding:10px 12px; border-radius:0; line-height:1.6; }
#pxp-root .pxp-hint b{ color:var(--pxp-wtx); font-weight:800; }
/* ---- 구매 전 확인 ---- */
#pxp-root .pxp-pre{ margin-top:16px; padding:14px 16px; border-radius:0; background:var(--pxp-head); border:1px solid var(--pxp-soft); }

#pxp-root .pxp-pre-t{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:800; letter-spacing:-.3px; color:#5a5a5a; }
#pxp-root .pxp-pre.is-important .pxp-pre-t{ color:var(--pxp-point); }
#pxp-root .pxp-pre p{ margin:8px 0 0; font-size:12.8px; line-height:1.75; color:#4a4a4a; letter-spacing:-.2px; }

/* ---- 조건이 바뀐 이유 ---- */
#pxp-root .pxp-swap{ margin:0 0 12px; padding:14px 16px; border-radius:0; background:var(--pxp-tint); border:1px solid var(--pxp-point); }
#pxp-root .pxp-swap-t{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:800; letter-spacing:-.5px; color:var(--pxp-ink); line-height:1.4; }
#pxp-root .pxp-swap-t svg{ flex:0 0 auto; }
#pxp-root .pxp-swap p{ margin:9px 0 0; font-size:13px; line-height:1.72; color:#5c3320; }
#pxp-root .pxp-chip.changed{ background:var(--pxp-tint); border-color:var(--pxp-point); color:#a33000; }
#pxp-root .pxp-chip.changed s{ color:#d3a08c; margin-right:3px; }
#pxp-root .pxp-chip.changed b{ color:var(--pxp-point); }
/* ---- 선정 근거 ---- */
#pxp-root .pxp-why{ margin-top:14px; padding:12px 14px; border-radius:0; font-size:12.8px; line-height:1.65;
  background:var(--pxp-head); border:1px solid var(--pxp-soft); color:#5a5a5a; }
#pxp-root .pxp-why b{ color:var(--pxp-ink); }
#pxp-root .pxp-why em{ font-style:normal; color:var(--pxp-point); font-weight:800; }
/* ---- 개인정보 안내 ---- */
#pxp-root .pxp-privacy{ display:flex; align-items:flex-start; gap:11px; padding:14px 24px;

#pxp-root .pxp-privacy svg{ flex:0 0 auto; margin-top:1px; }
#pxp-root .pxp-privacy p{ margin:0; font-size:12px; line-height:1.65; color:#5a5a5a; }
#pxp-root .pxp-privacy b{ color:var(--pxp-point); font-weight:800; }

@media (max-width:860px){

  #pxp-root .pxp-sum .k{ flex:0 0 auto; }

}

#pxp-root .pxp-fold-btn{ display:flex; align-items:center; gap:10px; width:100%; margin:0; padding:11px 12px 11px 14px;

#pxp-root .pxp-fold-l{ transition:color .15s; }

#pxp-root .pxp-fold-btn:active{ background:#ffe9df; }
/* 결과 화면 머리말 : 제목을 빼고 로고 한 줄로 압축 */

  /* --- 가산점 축 (0~1 로 정규화) --- */
  function boostValue(m, key, group) {

  function buildPool(ans) {

        wr = ans.res && ans.res !== "any",

        uu = ans.usbc === "must",

    function f(useI, useR, useU) {

        if (wb) {

  function score(ans) {

    var gd = (ans.genre || []).filter(function (v) { return v !== "none"; });
    var wd = (ans.work  || []).filter(function (v) { return v !== "none"; });

      if (pf.wc && m.s.con < CON_MIN) why.push("콘솔 활용 제한");

               inPool: pool.indexOf(m) >= 0, outWhy: why.join(" · "),

    var simRows = cand.filter(function (r) { return r.base >= best - SIM_BAND; });
    var simModels = simRows.map(function (r) { return r.m; });
    var extra = ans.usbc === "nice" ? ["usbc"] : [];   /* USB-C '있으면 좋겠어요' — 비슷한 후보끼리 비교할 때만 반영 */
    simRows.forEach(function (r) { r.boost = boostScore(r.m, bk, simModels, extra); r.inSim = true; });

    /* 동점 처리 — 「스코어링 규칙」 3단계 : 필수 조건 충족 수 → 예산 접근성 → 주사율 */
    function byPrice(a, b) {
      var ca = a.offCond ? 0 : 1, cb = b.offCond ? 0 : 1;
      var ba = a.m.x.budget == null ? 0 : a.m.x.budget;
      var bb = b.m.x.budget == null ? 0 : b.m.x.budget;
      return (cb - ca) || (bb - ba) || (b.m.refresh - a.m.refresh);
    }
    simRows.sort(function (a, b) { return (b.boost - a.boost) || (b.base - a.base) || byPrice(a, b); });
    var restIn = cand.filter(function (r) { return !r.inSim; })
                     .sort(function (a, b) { return b.base - a.base || byPrice(a, b); });
    /* 조건 밖 모델은 예산에 가까운 순서로 보여 드립니다.
       ① 할인 시 예산 안에 들어오는 모델 ② 예산 안이지만 크기·해상도 등이 다른 모델
       ③ 할인 시 예산 근접 + 다른 조건도 다른 모델 ④ 예산을 크게 넘는 모델 */
    function outTier(r) { return r.nearOnly ? 0 : !r.overBudget ? 1 : r.near ? 2 : 3; }
    var outPool = all.filter(function (r) { return !r.inPool; })
                     .sort(function (a, b) { return (outTier(a) - outTier(b)) || b.base - a.base || byPrice(a, b); });

    var rows = simRows.concat(restIn, outPool);
    if (!notes.length && pool.length < 3 && (pf.wi || pf.wr || pf.wb))
      notes.push("고르신 조건에 맞는 모니터가 많지 않아, 조건을 조금 넓힌 모델도 함께 보여드립니다.");

    /* 초고주사율은 PC가 그만큼 프레임을 낼 때 의미가 커집니다. (정합성 점검 C4) */
    if (rows[0] && rows[0].m.refresh >= 300)
      notes.push("300Hz 이상의 장점은 PC가 그만큼 높은 프레임을 낼 때 살아납니다. 지금 쓰시는 게임에서 나오는 프레임을 함께 확인해 보세요.");

    /* 고르신 조건과 실제 추천 결과가 달라진 부분을 정리합니다. */
    var top = rows[0], swap = null;
    if (top) {
      var dg = diagnose(ans, pf.cap, pf.wi, pf.wr, pf.wb, pf.uu, pf.wc);
      if (pf.wi && !sameSize(top.m, ans.inch)) {
        swap = { kind:"inch", label:"화면 크기", from: sizeLabel(ans.inch), to: top.m.inch + "인치", why: dg.why };
      } else if (pf.wr && top.m.res !== ans.res) {
        swap = { kind:"res", label:"해상도", from: RESL[ans.res], to: RESL[top.m.res], why: dg.why };
      }
    }
    return { rows: rows, dims: gd.concat(wd).concat(ans.usbc === "must" ? ["usbc"] : [])
                                 .concat(cw ? ["con"] : []),
             notes: notes, simCount: simRows.length, boostKeys: bk, band: SIM_BAND,
             swap: swap, ans: ans, cond: pf };
  }
  function avg(s, keys) { var t = 0; keys.forEach(function (k) { t += s[k]; }); return t / keys.length; }

  /* 앞 글자의 받침 유무에 따라 조사를 고릅니다. (예: 콘솔 활용 → '은', 멀티윈도 → '는') */
  function josa(word, withBat, noBat) {
    var c = word.charCodeAt(word.length - 1);
    if (c < 0xac00 || c > 0xd7a3) return noBat;
    return ((c - 0xac00) % 28) ? withBat : noBat;
  }

  /* ========== 4. 상태 및 공통 유틸 ==========
     응답은 이 객체(메모리)에만 존재하며 쿠키·localStorage·서버 전송을 사용하지 않습니다. */
  var HEAD = { t:'나에게 맞는 픽시오는 <em>어떤 모델일까요?</em>',
               s:'즐겨 하시는 게임과 주로 하시는 일, 예산을 알려주시면 가장 잘 맞는 모니터를 찾아드립니다.' };
  var blank = function () { return { purpose:null, genre:[], work:[], inch:null, res:null, usbc:null, device:null, budget:null, boost:[] }; };
  var state = { step:0, ans:blank(), busy:false, timers:[] };
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function clearTimers() { state.timers.forEach(function (t) { clearTimeout(t); clearInterval(t); }); state.timers = []; }
  function later(fn, ms) { var t = setTimeout(fn, ms); state.timers.push(t); return t; }
  function optOf(q, v) { var h = null; q.options.forEach(function (o) { if (String(o.v) === String(v)) h = o; }); return h; }

  /* 선택 요약 텍스트 */
  function sumText(q) {
    var v = state.ans[q.id];
    if (q.type === "single") { var o = v === null ? null : optOf(q, v); return o ? (o.sl || o.l) : null; }
    if (!v || !v.length) return null;
    var ls = v.map(function (x) { var o = optOf(q, x); return o ? (o.sl || o.l) : x; });
    return ls.length > 2 ? ls[0] + " 외 " + (ls.length - 1) + "개" : ls.join(", ");
  }
  function renderSum() {
    var h = "";
    QUESTIONS.forEach(function (q, i) {
      var t = sumText(q), cls = t ? "is-done" : (i === state.step ? "is-now" : "is-todo");
      if (i === state.step && !t) cls = "is-now";
      h += '<li class="' + cls + '" data-i="' + i + '"><div class="k"><i>' + (t ? "✓" : (i + 1)) + '</i>' + esc(q.sum) + '</div>' +
           '<div class="v">' + (t ? esc(t) : "선택 전") + '</div></li>';
    });
    $("pxpSum").innerHTML = h;
    $("pxpSum").querySelectorAll("li.is-done").forEach(function (li) {
      li.addEventListener("click", function () {
        var i = +li.getAttribute("data-i");
        if (!state.busy && i !== state.step && state.step < QUESTIONS.length) goStep(i);
      });
    });
  }

  /* 화면 전환 : 페이드 아웃 → 교체 → 높이 애니메이션 → 페이드 인 */
  function swap(build, outMs) {
    if (state.busy) return;
    state.busy = true;
    var st = $("pxpStage"), h0 = st.offsetHeight;
    st.style.height = h0 + "px"; st.style.overflow = "hidden";
    st.classList.add("is-out");
    later(function () {
      build();
      var h1 = st.scrollHeight;
      st.classList.remove("is-out");
      st.style.transition = "height .3s cubic-bezier(.3,.8,.3,1)";
      requestAnimationFrame(function () { st.style.height = h1 + "px"; });
      state.busy = false;                       // 높이 애니메이션 중에도 다음 클릭을 받습니다
      later(function () { st.style.height = ""; st.style.overflow = ""; st.style.transition = ""; }, 320);
    }, outMs || 160);
  }
  function goStep(n) { swap(function () { state.step = n; renderQ(); }); }

  /* ========== 5. 문항 화면 ========== */
  function renderQ() {
    var q = QUESTIONS[state.step], cur = state.ans[q.id];
    $("pxpProg").style.display = "flex";
    $("pxpSide").style.display = "";
    $("pxpBody").classList.remove("is-wide");
    $("pxpProgFill").style.width = ((state.step + 1) / QUESTIONS.length * 100) + "%";
    $("pxpProgTxt").textContent = (state.step + 1) + " / " + QUESTIONS.length;

    var intro = state.step === 0
      ? '<div class="pxp-intro"><span class="pxp-intro-i" aria-hidden="true">i</span>' +
        '<p>같은 사양이라도 쓰시는 환경과 취향에 따라 만족도는 달라집니다. ' +
        'Pixio Pick!!은 어떤 제품부터 살펴보면 좋을지 방향을 잡아 드리며, ' +
        '마음에 드는 모델은 상세페이지에서 사양을 한 번 더 확인해 주세요.</p></div>'
      : '';
    var html = '<div class="pxp-q">' + intro + '<div class="pxp-sheet">' +
               '<div class="pxp-sec-head"><h3>' + esc(q.title) + '</h3>' +
               (q.sub ? '<span class="note">' + esc(q.sub) + '</span>' : '') + '</div>' +
               '<div class="pxp-sec-body">' +
               '<div class="pxp-opts' + (q.options.length <= 3 ? " is-single" : "") + '">';
    q.options.forEach(function (o) {
      var sel = q.type === "single" ? cur === o.v : (cur || []).indexOf(o.v) >= 0;
      var dim = isFull(q) && !sel;
      html += '<button type="button" class="pxp-opt' + (sel ? " is-sel" : "") + (dim ? " is-dim" : "") + '" data-v="' + o.v + '">' +
              '<span class="pxp-opt-l"><span class="pxp-chk">' + (sel ? "✓" : "") + '</span>' + esc(o.l) + '</span>' +
              (o.d ? '<span class="pxp-opt-d">' + esc(o.d) + '</span>' : '') + '</button>';
    });
    html += '</div>';
    if (q.max) html += '<div class="pxp-hint" id="pxpHint"></div>';
    html += '</div></div>';                       /* .pxp-sec-body / .pxp-sheet 닫기 */
    html += '<div class="pxp-nav">' +
            (state.step > 0 ? '<button type="button" class="pxp-btn" data-act="prev">이전</button>' : '') +
            '<button type="button" class="pxp-btn pxp-btn-main" data-act="next"' + (isDone(q) ? "" : " disabled") + '>' +
            (state.step === QUESTIONS.length - 1 ? "추천 결과 보기" : "다음") + '</button></div></div>';
    $("pxpStage").innerHTML = html;
    renderSum();
    updateHint(q);

    $("pxpStage").querySelectorAll(".pxp-opt").forEach(function (b) {
      b.addEventListener("click", function () { pick(q, b.getAttribute("data-v")); });
    });
    $("pxpStage").querySelectorAll("[data-act]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.getAttribute("data-act") === "next") next(); else goStep(state.step - 1);
      });
    });
  }
  function next() {
    if (state.step === QUESTIONS.length - 1) renderLoading();
    else goStep(state.step + 1);
  }
  function isDone(q) {
    var v = state.ans[q.id];
    return q.type === "single" ? (v !== null && v !== undefined) : (v && v.length > 0);
  }
  /* 고르기가 끝난 문항은 나머지 항목을 흐리게 보여 줍니다.
     흐려져도 그대로 눌러서 다른 항목으로 바꾸실 수 있습니다. */
  function isFull(q) {
    if (q.type === "single") return state.ans[q.id] !== null && state.ans[q.id] !== undefined;
    if (!q.max) return false;                       // 최대 개수가 없는 문항은 흐리게 하지 않습니다
    return (state.ans[q.id] || []).length >= q.max;
  }

  /* 선택 표시는 재렌더 없이 DOM만 갱신해 깜빡임을 없앱니다. */
  function markSel(q) {
    var st = $("pxpStage"), full = isFull(q);
    st.querySelectorAll(".pxp-opt").forEach(function (b) {
      var o = optOf(q, b.getAttribute("data-v"));
      var sel = q.type === "single" ? state.ans[q.id] === o.v : state.ans[q.id].indexOf(o.v) >= 0;
      b.classList.toggle("is-sel", sel);
      b.classList.toggle("is-dim", full && !sel);
      b.querySelector(".pxp-chk").textContent = sel ? "✓" : "";
    });
    var nx = st.querySelector('[data-act="next"]');
    if (nx) nx.disabled = !isDone(q);
    renderSum();
    updateHint(q);
  }
  function updateHint(q) {
    var el = $("pxpHint");
    if (!el || !q.max) return;
    var n = (state.ans[q.id] || []).length;
    el.innerHTML = n >= q.max
      ? "최대 " + q.max + "개까지 고를 수 있어요. 다른 항목을 누르면 <b>먼저 고른 항목이 해제</b>돼요."
      : "지금 " + n + "개 골랐어요 · 최대 " + q.max + "개까지 고를 수 있어요.";
  }
  function pick(q, raw) {
    if (state.busy) return;
    var o = optOf(q, raw), v = o.v;
    if (q.type === "single") {
      state.ans[q.id] = v;                           // 자동 이동 없이 선택만 반영 — '다음'을 눌러야 넘어갑니다
      markSel(q);
      return;
    }
    var arr = state.ans[q.id].slice();
    if (o.ex) { arr = arr.indexOf(v) >= 0 ? [] : [v]; }
    else {
      arr = arr.filter(function (x) {
        return !q.options.filter(function (z) { return z.ex; }).some(function (z) { return z.v === x; });
      });
      arr = arr.indexOf(v) >= 0 ? arr.filter(function (x) { return x !== v; }) : arr.concat([v]);
      if (q.max && arr.length > q.max) arr = arr.slice(arr.length - q.max);   // 가장 먼저 고른 항목을 밀어냅니다
    }
    state.ans[q.id] = arr;
    markSel(q);
  }

  /* ========== 6. 분석 로딩 (약 3.8초) ========== */
  var LOAD_STEPS = [
    "선택하신 내용 확인하기",
    "픽시오 모니터 하나씩 살펴보기",
    "즐기시는 게임과 하시는 일에 맞춰보기",
    "화면 크기 · 해상도 · 연결 환경 · 예산 맞춰보기",
    "가장 잘 맞는 한 대 고르기"
  ];
  var LOAD_MS = 3800;

  function renderLoading() {
    swap(function () {
      $("pxpProg").style.display = "none";
      $("pxpSide").style.display = "none";
      $("pxpBody").classList.add("is-wide");
      $("pxpSub").style.display = "";
      $("pxpTitle").innerHTML = '잘 맞는 모니터를 <em>찾고 있습니다</em>';
      $("pxpSub").textContent = "고르신 내용에 맞춰 픽시오 모니터 " + MODELS.length + "종을 하나씩 살펴보고 있습니다.";
      /* 로고가 파도치듯 움직이는 대기 화면 — 아래 진행 단계는 그대로입니다 */
      var WORD = "Pixio Pick!!";
      var wave = WORD.split("").map(function (ch, i) {
        if (ch === " ") return '<i class="sp" style="--i:' + i + '"></i>';
        var pt = i >= 6 ? " pt" : "";                 /* 'Pick!!' 은 포인트 컬러 */
        return '<i class="' + pt.trim() + '" style="--i:' + i + '">' + ch + '</i>';
      }).join("");

      $("pxpStage").innerHTML =
        '<div class="pxp-sheet"><div class="pxp-load">' +
        '<div class="pxp-wave" aria-label="Pixio Pick">' + wave + '</div>' +
        '<div class="pxp-lbar"><div class="pxp-lbar-f" id="pxpBar"></div></div>' +
        '<div class="pxp-lpct" id="pxpPct">0<span>%</span></div>' +
        '<div class="pxp-load-s">잠시만 기다려 주세요</div>' +
        '<ul class="pxp-steps" id="pxpSteps">' +
        LOAD_STEPS.map(function (t) { return '<li><span class="pxp-dot"></span>' + esc(t) + '</li>'; }).join("") +
        '</ul><div class="pxp-tick" id="pxpTick"></div></div></div>';

      var t0 = Date.now(), pct = $("pxpPct"), bar = $("pxpBar"), tick = $("pxpTick"), lis = $("pxpSteps").children;
      var iv = setInterval(function () {
        var p = Math.min(1, (Date.now() - t0) / LOAD_MS);
        var shown = Math.round((1 - Math.pow(1 - p, 1.35)) * 100);
        pct.innerHTML = shown + '<span>%</span>';
        bar.style.width = shown + "%";
        var si = Math.min(LOAD_STEPS.length - 1, Math.floor(p * LOAD_STEPS.length));
        for (var k = 0; k < lis.length; k++) {
          lis[k].className = k < si ? "is-done" : (k === si ? "is-on" : "");
          lis[k].querySelector(".pxp-dot").textContent = k < si ? "✓" : "";
        }
        if (p >= 1) { clearInterval(iv); for (var n = 0; n < lis.length; n++) { lis[n].className = "is-done"; lis[n].querySelector(".pxp-dot").textContent = "✓"; } }
      }, 40);
      state.timers.push(iv);

      var mi = 0;
      var iv2 = setInterval(function () {
        tick.innerHTML = '확인 중 · <b>' + esc(MODELS[mi % MODELS.length].name) + '</b>'; mi++;
      }, 280);
      state.timers.push(iv2);

      later(function () { clearInterval(iv2); swap(renderResult, 220); }, LOAD_MS + 200);
    });
  }

  /* ========== 7. 결과 ========== */

  /* 육각 도표의 6개 축 — 매트릭스 12개 용도 축을 고객이 이해하기 쉬운 묶음으로 정리했습니다 */
  var HEX = [
    { k:"경쟁·속도", keys:["fps","moba"] },
    { k:"몰입·화질", keys:["aaa","dark","race"] },
    { k:"사진·영상", keys:["photo","video"] },
    { k:"문서·업무", keys:["doc"] },
    { k:"넓은 화면", keys:["hires","multi"] },
    { k:"연결·콘솔", keys:["usbc","con"] }
  ];

  /* 제품 이미지 — 표시만 담당하고, 불러오기 실패 처리는 bindShots() 에서 붙입니다.
     (속성에 스크립트를 넣으면 브라우저·보안 설정에 따라 동작이 달라져 일부만 보이는 문제가 생깁니다) */
  function shot(m, cls) {
    if (!m.img) return "";
    return '<div class="' + cls + '"><img class="pxp-img" src="' + m.img + '" alt="' + esc(m.name) + '"' +
           (m.img2 ? ' data-alt="' + m.img2 + '"' : '') + ' decoding="async"></div>';
  }

  /* 이미지 하나하나에 대체 주소·실패 처리를 붙입니다. 이미 실패한 이미지도 다시 확인합니다. */
  function bindShots(root) {
    Array.prototype.forEach.call(root.querySelectorAll("img.pxp-img"), function (im) {
      function fail() {
        var alt = im.getAttribute("data-alt");
        if (alt && !im.dataset.tried) { im.dataset.tried = "1"; im.src = alt; return; }
        im.parentNode.className += " is-off";
      }
      im.addEventListener("error", fail);
      if (im.complete && im.naturalWidth === 0) fail();      // 렌더 전에 이미 실패한 경우
    });
  }

  /* 이 제품의 강점 — '게임 및 작업 추천 사양' 시트의 실측 사양을 근거로 정리한 문장입니다 */
  function plusBox(m) {
    if (!m.plus || !m.plus.length) return "";
    return '<div class="pxp-plus"><div class="pxp-plus-t">이 모니터가 잘하는 것</div><ul>' +
      m.plus.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") + '</ul></div>';
  }

  /* 고르신 용도에 얼마나 맞는지 — 육각 도표 */
  function radar(m, dims) {
    var cx = 170, cy = 132, R = 86, LR = R + 19;
    var on = {};
    dims.forEach(function (d) {
      HEX.forEach(function (hx, i) { if (hx.keys.indexOf(d) >= 0) on[i] = true; });
    });
    function pt(i, r) {
      var a = (-90 + i * 60) * Math.PI / 180;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    }
    function poly(r) {
      var out = [];
      for (var i = 0; i < 6; i++) { var q = pt(i, r); out.push(q[0].toFixed(1) + "," + q[1].toFixed(1)); }
      return out.join(" ");
    }
    var g = "";
    for (var lv = 5; lv >= 1; lv--) {
      g += '<polygon points="' + poly(R * lv / 5) + '" fill="' + (lv === 5 ? "#fbfbfb" : "none") +
           '" stroke="' + (lv === 5 ? "#c9c9c9" : "#e8e8e8") + '" stroke-width="1"/>';
    }
    for (var i = 0; i < 6; i++) {
      var q = pt(i, R);
      g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + q[0].toFixed(1) + '" y2="' + q[1].toFixed(1) +
           '" stroke="#e8e8e8" stroke-width="1"/>';
    }
    var vals = HEX.map(function (hx) {
      var t = 0; hx.keys.forEach(function (k) { t += m.s[k]; }); return t / hx.keys.length;
    });
    var dp = vals.map(function (v, i) {
      var q = pt(i, R * Math.max(0.1, v / 5)); return q[0].toFixed(1) + "," + q[1].toFixed(1);
    });
    g += '<polygon points="' + dp.join(" ") + '" fill="rgba(255,66,0,.15)" stroke="#ff4200" stroke-width="2" stroke-linejoin="round"/>';
    vals.forEach(function (v, i) {
      var q = pt(i, R * Math.max(0.1, v / 5));
      g += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3.4" fill="#ff4200"/>';
    });
    HEX.forEach(function (hx, i) {
      var q = pt(i, LR);
      var anc = (i === 0 || i === 3) ? "middle" : (i === 1 || i === 2 ? "start" : "end");
      var dy = i === 0 ? -3 : (i === 3 ? 12 : 4);
      g += '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] + dy).toFixed(1) + '" text-anchor="' + anc +
           '" class="' + (on[i] ? "on" : "") + '">' + hx.k + '</text>';
    });
    return '<div class="pxp-radar">' +
           '<div class="pxp-rad-h"><div class="pxp-rad-t">내가 고른 용도와 이 모델의 궁합</div>' +
           '<div class="pxp-rad-lg"><i></i>주황색이 내가 고른 용도</div></div>' +
           '<svg class="pxp-rad" viewBox="0 0 340 262" aria-hidden="true">' + g + '</svg></div>';
  }

  var BOOST_L = { speed:"부드러운 화면", quality:"색감·명암", space:"넓은 작업 공간",
                  cost:"합리적인 가격", color:"책상과 어울리는 디자인" };

  /* 선정 근거 — 1단계(용도 적합도)와 2단계(가산점)를 나누어 설명 */
  function whyBox(r, top) {
    var t;
    if (r.simCount <= 1) {
      return '';                                   /* 비교 대상이 없을 때는 따로 설명하지 않습니다 */
    } else if (r.boostKeys.length) {
      var names = r.boostKeys.map(function (k) { return BOOST_L[k]; }).join(" · ");
      t = '비슷하게 잘 맞는 <b>' + r.simCount + '개 모니터</b> 가운데 <em>' + esc(names) + '</em>' + josa(names, "을", "를") + ' 우선해 골랐습니다.';
    } else {
      t = '비슷하게 잘 맞는 <b>' + r.simCount + '개 모니터</b> 가운데 <b>가장 합리적인</b> 모델로 골랐습니다.';
    }
    return '<div class="pxp-why">' + t + '</div>';
  }

  /* 고르신 조건과 다른 결과가 나왔을 때, 그 이유를 결과 맨 위에 설명합니다. */
  function swapBox(sw, top) {
    if (!sw) return "";
    return '<div class="pxp-swap">' +
      '<div class="pxp-swap-t">' +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ff4200" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M7 16V4M7 4L3 8M7 4l4 4"/><path d="M17 8v12M17 20l4-4M17 20l-4-4"/></svg>' +
      esc(sw.from) + '를 고르셨지만 <span style="color:#ff4200">' + esc(sw.to) + '</span> 모델을 추천드립니다</div>' +
      '<p>' + esc(sw.why) + '. 나머지 조건은 그대로 두고 ' + esc(sw.label) + '만 조정했습니다.</p></div>';
  }

  /* 연결 환경 안내 — 콘솔을 함께 쓰신다고 답하셨고, 그 모델의 콘솔 활용에 제약이 있을 때만 표시합니다.
     단점을 나열하는 자리가 아니라 '연결하기 전에 알고 계시면 좋은 사실'만 담습니다. */
  function preBox(m, ans) {
    var withConsole = ans && (ans.device === "both" || ans.device === "con");
    if (!withConsole || !m.pre || !m.pre.text) return "";
    return '<div class="pxp-pre' + (m.pre.level === "중요 안내" ? ' is-important' : '') + '">' +
      '<div class="pxp-pre-t">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>콘솔도 함께 쓰신다면 알아두세요</div>' +
      '<p>' + esc(m.pre.text) + '</p></div>';
  }

  /* 2·3순위를 함께 보여드리는 이유 — 1순위와 무엇이 다른지 알려드립니다 */
  function altReason(a, top, dims) {
    var uniq = dims.filter(function (d, i) { return dims.indexOf(d) === i && d !== "con"; });
    var better = uniq.filter(function (d) { return a.m.s[d] > top.m.s[d]; })
                     .sort(function (x, y) { return (a.m.s[y] - top.m.s[y]) - (a.m.s[x] - top.m.s[x]); });
    if (better.length) {
      var nm = DIM[better[0]];
      return '고르신 용도 가운데 <b>' + nm + '</b>' + josa(nm, "은", "는") + ' 이 모델이 한 단계 더 좋습니다';
    }
    var d = [];
    if (a.m.inch !== top.m.inch)  d.push(a.m.inch + '형');
    if (a.m.res !== top.m.res)    d.push(RESL[a.m.res]);
    if (a.m.refresh > top.m.refresh) d.push(a.m.refresh + 'Hz');
    if (a.m.colorways >= 8 && top.m.colorways < 8) d.push('컬러 ' + a.m.colorways + '종');
    if (a.m.s.usbc >= 4 && top.m.s.usbc < 4) d.push('USB-C 한 케이블 연결');
    if (d.length) return '1순위와 비슷하게 잘 맞으며 <b>' + esc(d.slice(0, 3).join(' · ')) + '</b> 구성이 다릅니다';
    return '고르신 조건을 함께 만족하는 모델입니다';
  }
  function altReasonOut(a) {
    if (a.nearOnly) return '정상가는 예산을 조금 넘지만, <b>할인 기간에는 예산 안에 들어올 수 있는 모델</b>입니다';
    var w = (a.outWhy || "").split(" · ").filter(function (x) { return x; });
    if (!w.length) return '고르신 조건에서 조금 벗어나지만 함께 보실 만합니다';
    return '<b>' + esc(w.slice(0, 3).join(' · ')) + '</b> — 고르신 조건에서는 조금 벗어나지만 함께 보실 만합니다';
  }

  /* 접기·펼치기 — 기본은 모두 닫힌 상태이며, 펼친 상태는 저장하지 않습니다 */
  function foldBtn(id, label, hint) {
    return '<button type="button" class="pxp-fold-btn" aria-expanded="false" aria-controls="' + id + '">' +
           '<span class="pxp-fold-l">' + esc(label) + '</span>' +
           (hint ? '<span class="pxp-fold-h">' + esc(hint) + '</span>' : '') +
           '<span class="pxp-fold-i" aria-hidden="true">▼</span></button>';
  }
  function foldPanel(id, inner) {
    return '<div class="pxp-fold" id="' + id + '" inert><div class="pxp-fold-in">' + inner + '</div></div>';
  }
  function setFold(btn, open) {
    var p = $(btn.getAttribute("aria-controls"));
    if (!p) return;
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    p.classList.toggle("is-open", open);
    if (open) p.removeAttribute("inert"); else p.setAttribute("inert", "");
  }
  function bindFolds(root) {
    Array.prototype.forEach.call(root.querySelectorAll(".pxp-fold-btn"), function (b) {
      b.addEventListener("click", function () { setFold(b, b.getAttribute("aria-expanded") !== "true"); });
    });
  }

  function renderResult() {
    var r = score(state.ans), top = r.rows[0], dims = r.dims;
    var rest = r.rows.slice(1);
    var inAlts  = rest.filter(function (x) { return x.inPool; }).slice(0, 2);
    var outAlts = inAlts.length < 2
      ? rest.filter(function (x) { return !x.inPool; }).slice(0, 2 - inAlts.length) : [];
    var sw = r.swap;
    var chips = QUESTIONS.map(function (q) {
      var t = sumText(q);
      if (!t) return "";
      if (sw && ((sw.kind === "inch" && q.id === "inch") || (sw.kind === "res" && q.id === "res"))) {
        return '<span class="pxp-chip changed">' + esc(q.sum) + ' <s>' + esc(sw.from) + '</s> → <b>' + esc(sw.to) + '</b></span>';
      }
      return '<span class="pxp-chip">' + esc(q.sum) + ' <b>' + esc(t) + '</b></span>';
    }).join("");

    $("pxpProg").style.display = "none";
    $("pxpSide").style.display = "none";
    $("pxpBody").classList.add("is-wide");
    /* 결과 화면은 머리말 제목 없이 로고 한 줄만 둡니다 (화면 낭독기에는 '추천 결과'로 읽힘) */
    $("pxpTitle").textContent = "추천 결과";
    $("pxpSub").style.display = "none";
    document.querySelector("#pxp-root .pxp-head").classList.add("is-result");

    var cond = (r.notes || []).map(function (t) {
      return '<div class="pxp-note"><strong>안내</strong> · ' + t + '</div>';
    }).join("");

    var chipN = QUESTIONS.filter(function (q) { return sumText(q); }).length;
    var h = '<div class="pxp-res">' +
      foldBtn("pxpFoldCond", "고르신 조건 보기", chipN + "개 항목") +
      foldPanel("pxpFoldCond", '<div class="pxp-chips">' + chips + '</div>') +
      swapBox(sw, top) +
      '<div class="pxp-card">' +
      '<div class="pxp-sec-head"><h3>추천 모델</h3></div>' +
      '<div class="pxp-sec-body">' +

      /* 제품명 → 이미지 → 주요 내용 */
      '<div><span class="pxp-badge">' + esc(top.m.badge) + '</span>' +
      (top.m.colorways >= 8 ? '<span class="pxp-badge col">' + top.m.colorways + '가지 컬러</span>' : '') + '</div>' +
      '<div class="pxp-card-top"><div><h3 class="pxp-name">' + esc(top.m.name) + '</h3>' +
      '<p class="pxp-model">' + esc(top.m.series) + ' SERIES</p></div></div>' +
      shot(top.m, "pxp-shot") +
      '<p class="pxp-hl">' + esc(top.m.headline) + '</p>' +
      '<div class="pxp-specs">' +
      top.m.specs.slice(0, 6).map(function (x) { return '<span class="pxp-spec">' + esc(x) + '</span>'; }).join("") +
      '</div>' +
      /* 구매 판단에 바로 영향을 주는 안내는 접지 않고 보여 드립니다 */
      preBox(top.m, r.ans) +
      cond +
      /* 자세한 설명은 고객이 원할 때 펼쳐 봅니다 */
      '<div class="pxp-fold-wrap">' +
      foldBtn("pxpFoldMore", "이 모델 자세히 알아보기", "설명 · 강점 · 궁합 도표") +
      foldPanel("pxpFoldMore",
        (top.m.voice && top.m.voice.length
          ? '<div class="pxp-voice"><div class="pxp-voice-t">이런 고민, 하고 계셨나요?</div>' +
            top.m.voice.map(function (v) { return '<p>“' + esc(v) + '”</p>'; }).join("") + '</div>'
          : '') +
        '<p class="pxp-desc" style="margin-top:16px">' + esc(top.m.desc) + '</p>' +
        plusBox(top.m) +
        (top.m.cardText ? '<div class="pxp-card-say">' + esc(top.m.cardText) + '</div>' : '') +
        whyBox(r, top) +
        radar(top.m, dims)) +
      '</div></div></div>';

    /* 추천 모델 바로 아래에 이동 버튼 */
    h += '<div class="pxp-cta"><a class="pxp-btn pxp-btn-main" href="' + top.m.price.url + '" target="_blank" rel="noopener">' +
         esc(top.m.name) + ' 자세히 보기</a>' +
         '<button type="button" class="pxp-btn" data-act="again">다시 찾아보기</button></div>';

    /* 2·3순위 */
    function altCard(a, rank, why) {
      return '<div class="pxp-alt">' +
        '<div class="pxp-alt-rank">' + rank + '순위</div>' +
        '<div class="pxp-alt-n">' + esc(a.m.name) + '</div>' +
        shot(a.m, "pxp-alt-img") +
        '<div class="pxp-alt-d">' + esc(a.m.oneline || a.m.short) + '</div>' +
        '<div class="pxp-alt-s">' + esc(a.m.specs.slice(0, 3).join(" · ")) + '</div>' +
        '<div class="pxp-alt-why">' + why + '</div>' +
        '<a class="pxp-alt-cta" href="' + a.m.price.url + '" target="_blank" rel="noopener">' +
        esc(a.m.name) + ' 자세히 보기</a></div>';
    }
    var alts = [], altNames = [], rank = 2;
    inAlts.forEach(function (a) { alts.push(altCard(a, rank++, altReason(a, top, dims))); altNames.push(a.m.name); });
    outAlts.forEach(function (a) { alts.push(altCard(a, rank++, altReasonOut(a))); altNames.push(a.m.name); });
    if (alts.length) {
      /* 접혀 있어도 어떤 모델인지 알 수 있도록 버튼에 모델명을 함께 적습니다 */
      h += '<div class="pxp-fold-wrap is-alts">' +
           foldBtn("pxpFoldAlts", "함께 살펴보실 만한 모델", altNames.join(" · ")) +
           foldPanel("pxpFoldAlts", '<div class="pxp-alts">' + alts.join("") + '</div>') + '</div>';
    }

    h += '<p class="pxp-foot">이 결과는 제품 선택을 돕기 위한 참고용 안내입니다. ' +
         '자세한 사양과 가격은 제품 상세페이지에서 확인해 주세요.<br>' +
         '설치 전에는 책상 폭·깊이와 제품 외형 치수를 한 번 비교해 보시길 권해 드립니다.</p></div>';

    $("pxpStage").innerHTML = h;
    bindShots($("pxpStage"));
    bindFolds($("pxpStage"));
    state.ans = blank();          // 결과 산출 완료 → 응답 데이터 즉시 초기화 (저장하지 않음)

    $("pxpStage").querySelector('[data-act="again"]').addEventListener("click", function () {
      swap(function () { hardReset(); renderQ(); });
    });
  }

  function hardReset() {
    clearTimers();
    state.step = 0; state.ans = blank(); state.busy = false;
    $("pxpTitle").innerHTML = HEAD.t;
    $("pxpSub").textContent = HEAD.s;
    $("pxpSub").style.display = "";
    document.querySelector("#pxp-root .pxp-head").classList.remove("is-result");
  }

  /* ========== 8. 팝업 제어 ========== */
  function open()  { hardReset(); renderQ(); $("pxpOverlay").classList.add("is-open"); document.body.style.overflow = "hidden"; }
  function close() { clearTimers(); state.busy = false; state.ans = blank(); $("pxpOverlay").classList.remove("is-open"); document.body.style.overflow = ""; }

  document.addEventListener("DOMContentLoaded", function () {
    $("pxpClose").addEventListener("click", close);
    /* 바깥 영역 클릭으로는 닫지 않습니다 — 결과를 보시다가 실수로 닫히는 일을 막기 위해서입니다.
       닫기는 오른쪽 위 × 버튼으로만 동작합니다. */
    document.addEventListener("keydown", function (e) {
      /* 결과 화면에서는 Esc 로도 닫히지 않게 해 실수로 결과가 사라지는 일을 막습니다 */
      if (e.key !== "Escape") return;
      if (!$("pxpOverlay").classList.contains("is-open")) return;   /* 팝업이 닫혀 있으면 아무것도 하지 않습니다 */
      if ($("pxpStage").querySelector(".pxp-res")) return;          /* 결과 화면은 Esc 로 닫지 않습니다 */
      close();
    });
    Array.prototype.forEach.call(document.querySelectorAll(".pxp-trigger"), function (b) {
      b.addEventListener("click", open);
    });
    var AUTO_OPEN = false;               // ← true 로 바꾸면 3초 뒤 자동 노출
    if (AUTO_OPEN) setTimeout(open, 3000);
    renderQ();
  });

  return { open:open, close:close, _score:score, _models:MODELS, _questions:QUESTIONS };
})();
</script>
<!-- ▲ 여기까지 복사 -->
</body>
