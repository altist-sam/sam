<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIXIO PICK · 나에게 맞는 모니터 찾기</title>
<!--
====================================================================
  PIXIO PICK — 게임·작업·예산 기반 모니터 추천 팝업  (Ver 2.0 / 단일 HTML)
  데이터 출처 : 픽시오_모니터_게임_작업_추천가이드_Ver1.4.xlsx
                (적합도 매트릭스 / 추천 사양 / 홈페이지 문구 / 평가 기준 / 판매가 조사)

  [홈페이지 삽입 방법]
  1) 이 파일 하나만 업로드하면 동작합니다. (외부 CSS/JS/폰트 의존 없음)
  2) 기존 페이지에 넣을 때는 <body> 안의
       <div id="pxp-root"> ... </div>  블록과
       <style id="pxp-style">, <script id="pxp-script">  3개만 복사하세요.
     모든 CSS는 #pxp-root 하위로 스코프되어 기존 홈페이지 스타일과 충돌하지 않습니다.
  3) 팝업 열기 : 아무 버튼에 onclick="PXP.open()" 또는 class="pxp-trigger" 부여
     팝업 닫기 : PXP.close()
  4) 자동 노출(첫 진입 3초 뒤 자동 오픈)은 스크립트 최하단 AUTO_OPEN 값을 true 로 변경.
  5) 제품 상세페이지 연결 : 아래 MODELS 배열의 url 값을 실제 주소로 교체.
  6) 개인정보 : 응답은 페이지 메모리에서만 다뤄지며 쿠키·localStorage·서버 전송을
     일절 사용하지 않습니다. 결과 산출 직후 응답 객체를 즉시 초기화합니다.
====================================================================
-->
<style id="pxp-style">
#pxp-root, #pxp-root *, #pxp-root *::before, #pxp-root *::after { box-sizing: border-box; }
#pxp-root {
  --pxp-bg:#ffffff; --pxp-soft:#f6f9fd; --pxp-soft2:#eef4fb; --pxp-line:#e3eaf4; --pxp-line2:#d3ddec;
  --pxp-txt:#161c28; --pxp-dim:#5a677c; --pxp-mute:#8b96a8;
  --pxp-acc:#0a9fc0; --pxp-acc2:#3a6fe0; --pxp-warn:#c07a12;
  --pxp-l5:#0a9fc0; --pxp-l4:#3a6fe0; --pxp-l3:#93a1b5; --pxp-l2:#d98214; --pxp-l1:#d95757;
  --pxp-grad:linear-gradient(95deg,#0aa6c8,#3a6fe0);
  font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#pxp-root .pxp-overlay{
  position:fixed; inset:0; z-index:99999; display:none;
  background:rgba(22,32,48,.42); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  padding:24px 16px; overflow-y:auto;
}
#pxp-root .pxp-overlay.is-open{ display:block; animation:pxpFade .22s ease both; }
@keyframes pxpFade{from{opacity:0}to{opacity:1}}
@keyframes pxpUp{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pxpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#pxp-root .pxp-modal{
  position:relative; width:100%; max-width:960px; margin:0 auto; background:var(--pxp-bg);
  border:1px solid var(--pxp-line); border-radius:20px; color:var(--pxp-txt);
  box-shadow:0 30px 70px rgba(24,38,64,.20), 0 2px 6px rgba(24,38,64,.06);
  animation:pxpUp .3s cubic-bezier(.2,.7,.3,1) both; overflow:hidden;
  text-align:left; line-height:1.5;                 /* 삽입 페이지의 정렬·행간 상속 차단 */
}
#pxp-root .pxp-modal::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--pxp-grad); }
#pxp-root .pxp-x{
  position:absolute; top:15px; right:15px; width:34px; height:34px; border-radius:9px;
  background:#fff; border:1px solid var(--pxp-line); color:var(--pxp-mute);
  font-size:18px; line-height:1; cursor:pointer; transition:.15s;
}
#pxp-root .pxp-x:hover{ background:var(--pxp-soft2); color:var(--pxp-txt); }
#pxp-root .pxp-head{ padding:30px 32px 22px; border-bottom:1px solid var(--pxp-line); background:linear-gradient(180deg,#f8fbff,#fff); }
#pxp-root .pxp-brand{ display:flex; align-items:center; gap:9px; margin-bottom:12px; }
#pxp-root .pxp-brand span{ font-size:12px; letter-spacing:.18em; font-weight:800; color:var(--pxp-acc); }
#pxp-root .pxp-brand i{ display:block; width:18px; height:3px; border-radius:3px; background:var(--pxp-grad); }
#pxp-root .pxp-title{ margin:0; font-size:27px; font-weight:800; letter-spacing:-.7px; line-height:1.3; }
#pxp-root .pxp-title em{ font-style:normal; background:var(--pxp-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
#pxp-root .pxp-sub{ margin:10px 0 0; font-size:14px; color:var(--pxp-dim); line-height:1.65; }
#pxp-root .pxp-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
#pxp-root .pxp-meta span{ padding:5px 11px; border-radius:99px; font-size:11.5px; font-weight:700; color:var(--pxp-acc);
  background:rgba(10,159,192,.09); border:1px solid rgba(10,159,192,.22); }
#pxp-root .pxp-body{ padding:24px 32px 26px; display:grid; grid-template-columns:1fr 236px; gap:26px; align-items:start; }
#pxp-root .pxp-body.is-wide{ grid-template-columns:1fr; }
#pxp-root .pxp-main{ min-width:0; }
/* ---- 진행바 ---- */
#pxp-root .pxp-prog{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
#pxp-root .pxp-prog-bar{ flex:1; height:6px; background:var(--pxp-soft2); border-radius:99px; overflow:hidden; }
#pxp-root .pxp-prog-fill{ height:100%; width:0; border-radius:99px; background:var(--pxp-grad); transition:width .35s cubic-bezier(.3,.8,.3,1); }
#pxp-root .pxp-prog-txt{ font-size:11.5px; font-weight:800; color:var(--pxp-mute); letter-spacing:.06em; white-space:nowrap; }
/* ---- 문항 ---- */
#pxp-root #pxpStage{ transition:opacity .17s ease, transform .17s ease; }
#pxp-root #pxpStage.is-out{ opacity:0; transform:translateY(-10px); }
#pxp-root .pxp-q{ animation:pxpIn .28s ease both; }
#pxp-root .pxp-q-title{ margin:0 0 6px; font-size:20px; font-weight:750; letter-spacing:-.4px; line-height:1.4; }
#pxp-root .pxp-q-sub{ margin:0 0 18px; font-size:12.5px; color:var(--pxp-mute); }
#pxp-root .pxp-opts{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
#pxp-root .pxp-opts.is-single{ grid-template-columns:1fr; }
#pxp-root .pxp-opt{
  display:block; width:100%; text-align:left; padding:15px 16px; border-radius:13px; cursor:pointer;
  background:var(--pxp-soft); border:1px solid var(--pxp-line); color:var(--pxp-txt);
  transition:.16s ease; font-family:inherit;
}
#pxp-root .pxp-opt:hover{ border-color:var(--pxp-acc); background:#fff; transform:translateY(-1px); box-shadow:0 6px 16px rgba(24,38,64,.07); }
#pxp-root .pxp-opt.is-sel{ border-color:var(--pxp-acc); background:rgba(10,159,192,.07); box-shadow:0 0 0 2px rgba(10,159,192,.16); }
#pxp-root .pxp-opt-l{ display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:700; letter-spacing:-.2px; }
#pxp-root .pxp-opt-l .pxp-chk{
  width:17px; height:17px; border-radius:5px; border:1.5px solid var(--pxp-line2); background:#fff; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff; transition:.16s;
}
#pxp-root .pxp-opt.is-sel .pxp-chk{ background:var(--pxp-acc); border-color:var(--pxp-acc); }
#pxp-root .pxp-opt-d{ margin-top:5px; padding-left:26px; font-size:12px; color:var(--pxp-mute); line-height:1.55; }
#pxp-root .pxp-nav{ display:flex; gap:10px; margin-top:22px; }
#pxp-root .pxp-btn{
  padding:13px 22px; border-radius:11px; font-size:14px; font-weight:750; cursor:pointer;
  border:1px solid var(--pxp-line2); background:#fff; color:var(--pxp-dim); font-family:inherit; transition:.16s;
}
#pxp-root .pxp-btn:hover{ color:var(--pxp-txt); border-color:var(--pxp-mute); }
#pxp-root .pxp-btn-main{ flex:1; border:none; color:#fff; background:var(--pxp-grad); box-shadow:0 8px 20px rgba(58,111,224,.22); }
#pxp-root .pxp-btn-main:hover{ filter:brightness(1.06); color:#fff; }
#pxp-root .pxp-btn-main:disabled{ opacity:.35; cursor:not-allowed; box-shadow:none; filter:none; }
/* ---- 선택 요약 ---- */
#pxp-root .pxp-side{ border:1px solid var(--pxp-line); border-radius:14px; background:var(--pxp-soft); padding:16px 16px 8px; }
#pxp-root .pxp-side-t{ font-size:11.5px; font-weight:800; letter-spacing:.1em; color:var(--pxp-mute); margin-bottom:12px; }
#pxp-root .pxp-sum{ list-style:none; margin:0; padding:0; }
#pxp-root .pxp-sum li{ padding:8px 0; border-bottom:1px dashed var(--pxp-line); }
#pxp-root .pxp-sum li:last-child{ border-bottom:none; }
#pxp-root .pxp-sum .k{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--pxp-mute); font-weight:700; }
#pxp-root .pxp-sum .k i{ font-style:normal; width:15px; height:15px; border-radius:50%; background:#fff; border:1px solid var(--pxp-line2);
  display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--pxp-mute); flex:0 0 auto; }
#pxp-root .pxp-sum .v{ margin-top:4px; font-size:12.5px; font-weight:700; color:var(--pxp-txt); line-height:1.45; word-break:keep-all; }
#pxp-root .pxp-sum li.is-todo .v{ color:var(--pxp-line2); }
#pxp-root .pxp-sum li.is-now .k{ color:var(--pxp-acc); }
#pxp-root .pxp-sum li.is-now .k i{ background:var(--pxp-acc); border-color:var(--pxp-acc); color:#fff; }
#pxp-root .pxp-sum li.is-done .k i{ background:rgba(10,159,192,.12); border-color:rgba(10,159,192,.4); color:var(--pxp-acc); }
#pxp-root .pxp-sum li.is-done{ cursor:pointer; }
#pxp-root .pxp-sum li.is-done:hover .v{ color:var(--pxp-acc); }
/* ---- 분석 로딩 ---- */
#pxp-root .pxp-load{ padding:14px 0 6px; text-align:center; animation:pxpIn .3s ease both; }
#pxp-root .pxp-scan{ position:relative; width:158px; height:158px; margin:0 auto 6px; }
#pxp-root .pxp-scan svg{ width:100%; height:100%; display:block; }
#pxp-root .pxp-ring{ fill:none; stroke:#e5edf7; stroke-width:1.4; }
#pxp-root .pxp-ring-a{ stroke:rgba(10,159,192,.45); stroke-dasharray:5 7; transform-origin:80px 80px; animation:pxpSpin 7s linear infinite; }
#pxp-root .pxp-ring-b{ stroke:rgba(58,111,224,.38); stroke-dasharray:2 9; transform-origin:80px 80px; animation:pxpSpin 4.5s linear infinite reverse; }
#pxp-root .pxp-sweep{ transform-origin:80px 80px; animation:pxpSpin 1.5s cubic-bezier(.5,.1,.5,.9) infinite; }
#pxp-root .pxp-blip{ animation:pxpBlip 1.5s ease-in-out infinite; }
@keyframes pxpSpin{ to{ transform:rotate(360deg) } }
@keyframes pxpBlip{ 0%,100%{opacity:.18} 50%{opacity:1} }
#pxp-root .pxp-scan-pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:28px; font-weight:850; letter-spacing:-1.2px; color:var(--pxp-acc); }
#pxp-root .pxp-scan-pct span{ font-size:14px; font-weight:700; margin-left:1px; opacity:.7; }
#pxp-root .pxp-load-t{ font-size:17px; font-weight:750; letter-spacing:-.3px; margin-top:6px; }
#pxp-root .pxp-load-s{ font-size:12.5px; color:var(--pxp-mute); margin-top:6px; }
#pxp-root .pxp-steps{ list-style:none; margin:20px auto 0; padding:0; max-width:330px; text-align:left; }
#pxp-root .pxp-steps li{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:#b3bdcc; padding:5px 0; transition:color .3s ease; }
#pxp-root .pxp-steps li .pxp-dot{ width:16px; height:16px; border-radius:50%; border:1.5px solid var(--pxp-line2); background:#fff; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; font-size:9px; color:#fff; transition:.3s ease; }
#pxp-root .pxp-steps li.is-on{ color:var(--pxp-txt); }
#pxp-root .pxp-steps li.is-on .pxp-dot{ border-color:var(--pxp-acc); background:rgba(10,159,192,.2);
  box-shadow:0 0 0 4px rgba(10,159,192,.09); animation:pxpBlip 1s ease-in-out infinite; }
#pxp-root .pxp-steps li.is-done{ color:var(--pxp-dim); }
#pxp-root .pxp-steps li.is-done .pxp-dot{ background:var(--pxp-acc); border-color:var(--pxp-acc); animation:none; box-shadow:none; }
#pxp-root .pxp-tick{ margin-top:16px; font-size:11.5px; color:var(--pxp-mute); height:16px; }
#pxp-root .pxp-tick b{ color:var(--pxp-dim); font-weight:800; }
/* ---- 결과 ---- */
#pxp-root .pxp-res{ animation:pxpIn .35s ease both; }
#pxp-root .pxp-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
#pxp-root .pxp-chip{ padding:5px 11px; border-radius:99px; font-size:11.5px; font-weight:700; color:var(--pxp-dim);
  background:var(--pxp-soft); border:1px solid var(--pxp-line); }
#pxp-root .pxp-chip b{ color:var(--pxp-acc); font-weight:800; }
#pxp-root .pxp-res-tag{ font-size:11px; font-weight:800; letter-spacing:.15em; color:var(--pxp-acc); margin-bottom:10px; }
#pxp-root .pxp-card{ position:relative; border-radius:16px; padding:24px; margin-bottom:14px;
  background:linear-gradient(160deg,rgba(10,159,192,.07),rgba(58,111,224,.045) 55%,#fff);
  border:1px solid rgba(10,159,192,.32); }
#pxp-root .pxp-badge{ display:inline-block; padding:5px 11px; border-radius:99px; font-size:11.5px; font-weight:800;
  background:rgba(10,159,192,.12); color:var(--pxp-acc); border:1px solid rgba(10,159,192,.28); margin-bottom:11px; }
#pxp-root .pxp-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
#pxp-root .pxp-name{ margin:0; font-size:23px; font-weight:800; letter-spacing:-.6px; line-height:1.3; }
#pxp-root .pxp-model{ margin:4px 0 0; font-size:11.5px; color:var(--pxp-mute); letter-spacing:.05em; }
#pxp-root .pxp-fit{ text-align:right; flex:0 0 auto; }
#pxp-root .pxp-fit-n{ font-size:34px; font-weight:850; line-height:1; background:var(--pxp-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
#pxp-root .pxp-fit-l{ font-size:10.5px; color:var(--pxp-mute); letter-spacing:.1em; margin-top:5px; }
#pxp-root .pxp-hl{ margin:15px 0 8px; font-size:15px; font-weight:750; color:var(--pxp-acc); letter-spacing:-.2px; }
#pxp-root .pxp-desc{ margin:0; font-size:13.2px; line-height:1.78; color:#3c4759; }
#pxp-root .pxp-specs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; }
#pxp-root .pxp-spec{ padding:5px 10px; border-radius:7px; font-size:11.5px; font-weight:700; color:#435063; background:#fff; border:1px solid var(--pxp-line); }
#pxp-root .pxp-bars{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--pxp-line2); }
#pxp-root .pxp-bars-t{ font-size:11.5px; font-weight:800; letter-spacing:.1em; color:var(--pxp-mute); margin-bottom:12px; }
#pxp-root .pxp-bar{ display:grid; grid-template-columns:96px 1fr 62px; align-items:center; gap:10px; margin-bottom:8px; }
#pxp-root .pxp-bar-k{ font-size:12px; color:var(--pxp-dim); font-weight:700; }
#pxp-root .pxp-bar-t{ height:8px; background:#e7eef8; border-radius:99px; overflow:hidden; }
#pxp-root .pxp-bar-f{ height:100%; border-radius:99px; width:0; transition:width .6s cubic-bezier(.3,.8,.3,1); }
#pxp-root .pxp-bar-v{ font-size:11px; font-weight:800; text-align:right; }
#pxp-root .pxp-note{ margin-top:14px; padding:12px 14px; border-radius:10px; font-size:12.2px; line-height:1.65;
  background:#fdf6e9; border:1px solid #f0dcb4; color:#8a6512; }
#pxp-root .pxp-note strong{ color:var(--pxp-warn); }
#pxp-root .pxp-alt-t{ font-size:11.5px; font-weight:800; letter-spacing:.12em; color:var(--pxp-mute); margin:22px 0 10px; }
#pxp-root .pxp-alts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; }
#pxp-root .pxp-alt{ padding:16px; border-radius:13px; background:#fff; border:1px solid var(--pxp-line); transition:.16s; }
#pxp-root .pxp-alt:hover{ border-color:var(--pxp-line2); transform:translateY(-1px); box-shadow:0 6px 16px rgba(24,38,64,.07); }
#pxp-root .pxp-alt-h{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
#pxp-root .pxp-alt-n{ font-size:14.5px; font-weight:750; letter-spacing:-.2px; line-height:1.35; }
#pxp-root .pxp-alt-f{ font-size:16px; font-weight:800; color:var(--pxp-acc2); flex:0 0 auto; }
#pxp-root .pxp-alt-d{ margin-top:7px; font-size:11.8px; color:var(--pxp-mute); line-height:1.6; }
#pxp-root .pxp-alt-s{ margin-top:9px; font-size:11px; color:#7d8798; }
#pxp-root .pxp-cta{ display:flex; gap:10px; margin-top:24px; }
#pxp-root .pxp-cta a.pxp-btn-main{ flex:1; text-align:center; text-decoration:none; display:block; }
#pxp-root .pxp-foot{ margin-top:16px; font-size:11px; color:var(--pxp-mute); line-height:1.6; text-align:center; }
/* ---- 개인정보 안내 ---- */
/* ---- 최대 선택 안내 ---- */
#pxp-root .pxp-opt-l .pxp-tag2{ margin-left:auto; font-size:11.5px; font-weight:800; color:var(--pxp-mute); letter-spacing:-.2px; }
#pxp-root .pxp-opt.is-sel .pxp-tag2{ color:var(--pxp-acc); }
#pxp-root .pxp-hint{ margin-top:12px; font-size:12px; color:var(--pxp-warn); background:#fdf6e9; border:1px solid #f0dcb4;
  border-radius:9px; padding:9px 12px; line-height:1.55; }
/* ---- 구매 전 확인 ---- */
#pxp-root .pxp-pre{ margin-top:16px; padding:15px 17px; border-radius:12px;
  background:#f4f8fb; border:1px solid #dde8f0; }
#pxp-root .pxp-pre.is-important{ background:#fff8ec; border-color:#f0dcb4; }
#pxp-root .pxp-pre-t{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:800;
  letter-spacing:.02em; color:#4a6377; }
#pxp-root .pxp-pre.is-important .pxp-pre-t{ color:#8a6512; }
#pxp-root .pxp-pre p{ margin:8px 0 0; font-size:12.8px; line-height:1.75; color:#4e5c6b; letter-spacing:-.1px; }
#pxp-root .pxp-pre.is-important p{ color:#6d5a34; }
/* ---- 조건이 바뀐 이유 ---- */
#pxp-root .pxp-swap{ margin:0 0 14px; padding:16px 18px; border-radius:13px;
  background:#fff8ec; border:1px solid #f0dcb4; }
#pxp-root .pxp-swap-t{ display:flex; align-items:center; gap:8px; font-size:15.5px; font-weight:800;
  color:#8a6512; letter-spacing:-.3px; line-height:1.45; }
#pxp-root .pxp-swap-t svg{ flex:0 0 auto; }
#pxp-root .pxp-swap p{ margin:9px 0 0; font-size:13px; line-height:1.72; color:#6d5a34; }
#pxp-root .pxp-chip.changed{ background:#fff8ec; border-color:#f0dcb4; color:#8a6512; }
#pxp-root .pxp-chip.changed s{ color:#c3ab7d; margin-right:3px; }
#pxp-root .pxp-chip.changed b{ color:#8a6512; }
/* ---- 선정 근거 ---- */
#pxp-root .pxp-why{ margin-top:14px; padding:12px 14px; border-radius:10px; font-size:12.8px; line-height:1.6;

      var num = 0, den = 0;
      if (gd.length) { num += pw.g * avg(m.s, gd); den += pw.g; }
      if (wd.length) { num += pw.w * avg(m.s, wd); den += pw.w; }
      var base = den ? num / den : 3;
      var why = [];
      if (pf.wi && m.inch !== ans.inch) why.push(m.inch + "형");
      if (pf.wr && m.res !== ans.res)   why.push(RESL[m.res]);
      if (pf.wb && m.price.now == null) why.push("가격 확인 중");
      else if (pf.wb && m.price.now > pf.cap) why.push("예산 초과 " + won(m.price.now) + "원");
      if (ans.usbc === "must" && m.s.usbc < 4) why.push("USB-C 미지원");
      if (pf.wc && !m.consoleNative) why.push("콘솔 네이티브 미지원");
      return { m:m, base:base, fit: Math.max(45, Math.min(99, Math.round(base / 5 * 100))),
               inPool: pool.indexOf(m) >= 0, outWhy: why.join(" · "),
               offCond: why.length > 0 };
    });

    /* 2단계 : 유사군(최고점 - 0.5 이내) 안에서만 가산점으로 순위 결정 */
    var cand = all.filter(function (r) { return r.inPool; });
    var best = cand.length ? Math.max.apply(null, cand.map(function (r) { return r.base; })) : 0;
    var simRows = cand.filter(function (r) { return r.base >= best - SIM_BAND; });
    var simModels = simRows.map(function (r) { return r.m; });
    simRows.forEach(function (r) { r.boost = boostScore(r.m, bk, simModels); r.inSim = true; });

    function byPrice(a, b) {                                  // 동점 시 : 판매가가 낮은 쪽 → 주사율이 높은 쪽
      var pa = a.m.price.now == null ? Infinity : a.m.price.now;
      var pb = b.m.price.now == null ? Infinity : b.m.price.now;
      return pa - pb || b.m.refresh - a.m.refresh;
    }
    simRows.sort(function (a, b) { return (b.boost - a.boost) || (b.base - a.base) || byPrice(a, b); });
    var restIn = cand.filter(function (r) { return !r.inSim; })
                     .sort(function (a, b) { return b.base - a.base || byPrice(a, b); });
    var outPool = all.filter(function (r) { return !r.inPool; })
                     .sort(function (a, b) { return b.base - a.base || byPrice(a, b); });

    var rows = simRows.concat(restIn, outPool);
    if (!notes.length && pool.length < 3 && (pf.wi || pf.wr || pf.wb))
      notes.push("고르신 조건에 맞는 모니터가 많지 않아, 조건을 조금 넓힌 모델도 함께 보여드립니다.");

    /* 고르신 조건과 실제 추천 결과가 달라진 부분을 정리합니다. */
    var top = rows[0], swap = null;
    if (top) {
      var dg = diagnose(ans, pf.cap, pf.wi, pf.wr, pf.wb, pf.uu, pf.wc);
      if (pf.wi && top.m.inch !== ans.inch) {
        swap = { kind:"inch", label:"화면 크기", from: ans.inch + "인치", to: top.m.inch + "인치", why: dg.why };
      } else if (pf.wr && top.m.res !== ans.res) {
        swap = { kind:"res", label:"해상도", from: RESL[ans.res], to: RESL[top.m.res], why: dg.why };
      }
    }
    return { rows: rows, dims: gd.concat(wd).concat(ans.usbc === "must" ? ["usbc"] : []),
             notes: notes, simCount: simRows.length, boostKeys: bk, band: SIM_BAND,
             swap: swap, ans: ans, cond: pf };
  }
  function avg(s, keys) { var t = 0; keys.forEach(function (k) { t += s[k]; }); return t / keys.length; }

  /* ========== 4. 상태 및 공통 유틸 ==========
     응답은 이 객체(메모리)에만 존재하며 쿠키·localStorage·서버 전송을 사용하지 않습니다. */
  var HEAD = { t:'나에게 맞는 픽시오는 <em>어떤 모델일까요?</em>',
               s:'즐겨 하시는 게임과 주로 하시는 일, 예산을 알려주시면 가장 잘 맞는 모니터를 찾아드립니다.' };
  var blank = function () { return { purpose:null, genre:[], work:[], inch:null, res:null, usbc:null, device:null, budget:null, boost:[] }; };
  var state = { step:0, ans:blank(), busy:false, timers:[] };
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function clearTimers() { state.timers.forEach(function (t) { clearTimeout(t); clearInterval(t); }); state.timers = []; }
  function later(fn, ms) { var t = setTimeout(fn, ms); state.timers.push(t); return t; }
  function optOf(q, v) { var h = null; q.options.forEach(function (o) { if (String(o.v) === String(v)) h = o; }); return h; }

  /* 선택 요약 텍스트 */
  function sumText(q) {
    var v = state.ans[q.id];
    if (q.type === "single") { var o = v === null ? null : optOf(q, v); return o ? (o.sl || o.l) : null; }
    if (!v || !v.length) return null;
    var ls = v.map(function (x) { var o = optOf(q, x); return o ? (o.sl || o.l) : x; });
    return ls.length > 2 ? ls[0] + " 외 " + (ls.length - 1) + "개" : ls.join(", ");
  }
  function renderSum() {
    var h = "";
    QUESTIONS.forEach(function (q, i) {
      var t = sumText(q), cls = t ? "is-done" : (i === state.step ? "is-now" : "is-todo");
      if (i === state.step && !t) cls = "is-now";
      h += '<li class="' + cls + '" data-i="' + i + '"><div class="k"><i>' + (t ? "✓" : (i + 1)) + '</i>' + esc(q.sum) + '</div>' +
           '<div class="v">' + (t ? esc(t) : "선택 전") + '</div></li>';
    });
    $("pxpSum").innerHTML = h;
    $("pxpSum").querySelectorAll("li.is-done").forEach(function (li) {
      li.addEventListener("click", function () {
        var i = +li.getAttribute("data-i");
        if (!state.busy && i !== state.step && state.step < QUESTIONS.length) goStep(i);
      });
    });
  }

  /* 화면 전환 : 페이드 아웃 → 교체 → 높이 애니메이션 → 페이드 인 */
  function swap(build, outMs) {
    if (state.busy) return;
    state.busy = true;
    var st = $("pxpStage"), h0 = st.offsetHeight;
    st.style.height = h0 + "px"; st.style.overflow = "hidden";
    st.classList.add("is-out");
    later(function () {
      build();
      var h1 = st.scrollHeight;
      st.classList.remove("is-out");
      st.style.transition = "height .3s cubic-bezier(.3,.8,.3,1)";
      requestAnimationFrame(function () { st.style.height = h1 + "px"; });
      state.busy = false;                       // 높이 애니메이션 중에도 다음 클릭을 받습니다
      later(function () { st.style.height = ""; st.style.overflow = ""; st.style.transition = ""; }, 320);
    }, outMs || 160);
  }
  function goStep(n) { swap(function () { state.step = n; renderQ(); }); }

  /* ========== 5. 문항 화면 ========== */
  function renderQ() {
    var q = QUESTIONS[state.step], cur = state.ans[q.id];
    $("pxpProg").style.display = "flex";
    $("pxpSide").style.display = "";
    $("pxpBody").classList.remove("is-wide");
    $("pxpProgFill").style.width = ((state.step + 1) / QUESTIONS.length * 100) + "%";
    $("pxpProgTxt").textContent = (state.step + 1) + " / " + QUESTIONS.length;

    var html = '<div class="pxp-q"><h3 class="pxp-q-title">' + esc(q.title) + '</h3>' +
               '<p class="pxp-q-sub">' + esc(q.sub) + '</p>' +
               '<div class="pxp-opts' + (q.options.length <= 3 ? " is-single" : "") + '">';
    q.options.forEach(function (o) {
      var sel = q.type === "single" ? cur === o.v : (cur || []).indexOf(o.v) >= 0;
      html += '<button type="button" class="pxp-opt' + (sel ? " is-sel" : "") + '" data-v="' + o.v + '">' +
              '<span class="pxp-opt-l"><span class="pxp-chk">' + (sel ? "✓" : "") + '</span>' + esc(o.l) + '</span>' +
              (o.d ? '<span class="pxp-opt-d">' + esc(o.d) + '</span>' : '') + '</button>';
    });
    html += '</div>';
    if (q.max) html += '<div class="pxp-hint" id="pxpHint"></div>';
    html += '<div class="pxp-nav">' +
            (state.step > 0 ? '<button type="button" class="pxp-btn" data-act="prev">이전</button>' : '') +
            '<button type="button" class="pxp-btn pxp-btn-main" data-act="next"' + (isDone(q) ? "" : " disabled") + '>' +
            (state.step === QUESTIONS.length - 1 ? "추천 결과 보기" : "다음") + '</button></div></div>';
    $("pxpStage").innerHTML = html;
    renderSum();
    updateHint(q);

    $("pxpStage").querySelectorAll(".pxp-opt").forEach(function (b) {
      b.addEventListener("click", function () { pick(q, b.getAttribute("data-v")); });
    });
    $("pxpStage").querySelectorAll("[data-act]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.getAttribute("data-act") === "next") next(); else goStep(state.step - 1);
      });
    });
  }
  function next() {
    if (state.step === QUESTIONS.length - 1) renderLoading();
    else goStep(state.step + 1);
  }
  function isDone(q) {
    var v = state.ans[q.id];
    return q.type === "single" ? (v !== null && v !== undefined) : (v && v.length > 0);
  }
  /* 선택 표시는 재렌더 없이 DOM만 갱신해 깜빡임을 없앱니다. */
  function markSel(q) {
    var st = $("pxpStage");
    st.querySelectorAll(".pxp-opt").forEach(function (b) {
      var o = optOf(q, b.getAttribute("data-v"));
      var sel = q.type === "single" ? state.ans[q.id] === o.v : state.ans[q.id].indexOf(o.v) >= 0;
      b.classList.toggle("is-sel", sel);
      b.querySelector(".pxp-chk").textContent = sel ? "✓" : "";
    });
    var nx = st.querySelector('[data-act="next"]');
    if (nx) nx.disabled = !isDone(q);
    renderSum();
    updateHint(q);
  }
  function updateHint(q) {
    var el = $("pxpHint");
    if (!el || !q.max) return;
    var n = (state.ans[q.id] || []).length;
    el.innerHTML = n >= q.max
      ? "최대 " + q.max + "개까지 선택할 수 있습니다. 다른 항목을 누르면 <b>먼저 고른 항목이 해제</b>됩니다."
      : "현재 " + n + "개 선택 · 최대 " + q.max + "개까지 고를 수 있습니다.";
  }
  function pick(q, raw) {
    if (state.busy) return;
    var o = optOf(q, raw), v = o.v;
    if (q.type === "single") {
      state.ans[q.id] = v;                           // 자동 이동 없이 선택만 반영 — '다음'을 눌러야 넘어갑니다
      markSel(q);
      return;
    }
    var arr = state.ans[q.id].slice();
    if (o.ex) { arr = arr.indexOf(v) >= 0 ? [] : [v]; }
    else {
      arr = arr.filter(function (x) {
        return !q.options.filter(function (z) { return z.ex; }).some(function (z) { return z.v === x; });
      });
      arr = arr.indexOf(v) >= 0 ? arr.filter(function (x) { return x !== v; }) : arr.concat([v]);
      if (q.max && arr.length > q.max) arr = arr.slice(arr.length - q.max);   // 가장 먼저 고른 항목을 밀어냅니다
    }
    state.ans[q.id] = arr;
    markSel(q);
  }

  /* ========== 6. 분석 로딩 (약 3.8초) ========== */
  var LOAD_STEPS = [
    "선택하신 내용 확인하기",
    "픽시오 모니터 하나씩 살펴보기",
    "즐기시는 게임과 하시는 일에 맞춰보기",
    "화면 크기 · 해상도 · 연결 환경 · 예산 맞춰보기",
    "가장 잘 맞는 한 대 고르기"
  ];
  var LOAD_MS = 3800;

  function renderLoading() {
    swap(function () {
      $("pxpProg").style.display = "none";
      $("pxpSide").style.display = "none";
      $("pxpBody").classList.add("is-wide");
      $("pxpSub").style.display = "";
      $("pxpTitle").innerHTML = '잘 맞는 모니터를 <em>찾고 있습니다</em>';
      $("pxpSub").textContent = "고르신 내용에 맞춰 픽시오 모니터를 살펴보고 있습니다.";
      var svg =
        '<svg viewBox="0 0 160 160" aria-hidden="true">' +
        '<defs><linearGradient id="pxpSweepG" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0%" stop-color="#0aa6c8" stop-opacity="0"/><stop offset="100%" stop-color="#0aa6c8" stop-opacity=".55"/>' +
        '</linearGradient></defs>' +
        '<circle class="pxp-ring" cx="80" cy="80" r="70"/>' +
        '<circle class="pxp-ring" cx="80" cy="80" r="52"/>' +
        '<circle class="pxp-ring" cx="80" cy="80" r="34"/>' +
        '<circle class="pxp-ring pxp-ring-a" cx="80" cy="80" r="61"/>' +
        '<circle class="pxp-ring pxp-ring-b" cx="80" cy="80" r="43"/>' +
        '<g class="pxp-sweep"><path d="M80 80 L150 80 A70 70 0 0 0 115 19 Z" fill="url(#pxpSweepG)" opacity=".6"/>' +
        '<line x1="80" y1="80" x2="150" y2="80" stroke="#0aa6c8" stroke-width="1.6"/></g>' +
        '<circle class="pxp-blip" cx="118" cy="52" r="3" fill="#3a6fe0"/>' +
        '<circle class="pxp-blip" cx="52"  cy="104" r="2.5" fill="#0aa6c8" style="animation-delay:.5s"/>' +
        '<circle class="pxp-blip" cx="96"  cy="118" r="2" fill="#0aa6c8" style="animation-delay:.9s"/>' +
        '</svg>';
      $("pxpStage").innerHTML =
        '<div class="pxp-load"><div class="pxp-scan">' + svg +
        '<div class="pxp-scan-pct" id="pxpPct">0<span>%</span></div></div>' +
        '<div class="pxp-load-t">거의 다 됐습니다</div>' +
        '<div class="pxp-load-s">잠시만 기다려 주세요</div>' +
        '<ul class="pxp-steps" id="pxpSteps">' +
        LOAD_STEPS.map(function (t) { return '<li><span class="pxp-dot"></span>' + esc(t) + '</li>'; }).join("") +
        '</ul><div class="pxp-tick" id="pxpTick"></div></div>';

      var t0 = Date.now(), pct = $("pxpPct"), tick = $("pxpTick"), lis = $("pxpSteps").children;
      var iv = setInterval(function () {
        var p = Math.min(1, (Date.now() - t0) / LOAD_MS);
        pct.innerHTML = Math.round((1 - Math.pow(1 - p, 1.35)) * 100) + '<span>%</span>';
        var si = Math.min(LOAD_STEPS.length - 1, Math.floor(p * LOAD_STEPS.length));
        for (var k = 0; k < lis.length; k++) {
          lis[k].className = k < si ? "is-done" : (k === si ? "is-on" : "");
          lis[k].querySelector(".pxp-dot").textContent = k < si ? "✓" : "";
        }
        if (p >= 1) { clearInterval(iv); for (var n = 0; n < lis.length; n++) { lis[n].className = "is-done"; lis[n].querySelector(".pxp-dot").textContent = "✓"; } }
      }, 40);
      state.timers.push(iv);

      var mi = 0;
      var iv2 = setInterval(function () {
        tick.innerHTML = '확인 중 · <b>' + esc(MODELS[mi % MODELS.length].name) + '</b>'; mi++;
      }, 280);
      state.timers.push(iv2);

      later(function () { clearInterval(iv2); swap(renderResult, 220); }, LOAD_MS + 200);
    });
  }

  /* ========== 7. 결과 ========== */
  function bars(m, dims) {
    if (!dims.length) return "";
    var uniq = dims.filter(function (d, i) { return dims.indexOf(d) === i; });
    uniq.sort(function (a, b) { return m.s[b] - m.s[a]; });
    var h = '<div class="pxp-bars"><div class="pxp-bars-t">고르신 용도에 얼마나 맞는지</div>';
    uniq.forEach(function (d) {
      var v = m.s[d];
      h += '<div class="pxp-bar"><div class="pxp-bar-k">' + DIM[d] + '</div>' +
           '<div class="pxp-bar-t"><div class="pxp-bar-f" style="width:' + (v / 5 * 100) + '%;background:var(' + LVCOL[v] + ')"></div></div>' +
           '<div class="pxp-bar-v" style="color:var(' + LVCOL[v] + ')">' + LEVEL[v] + '</div></div>';
    });
    return h + '</div>';
  }

  var BOOST_L = { speed:"빠른 주사율", quality:"화질", space:"넓은 화면",
                  cost:"가격 부담", color:"책상 분위기와 컬러" };

  /* 가격 블록 — 판매가 조사 시트(2026-08-28) 기준 */
  function priceBox(m) {
    if (m.price.now == null) {
      return '<div class="pxp-price na"><div><div class="pl">공식 판매가</div>' +
             '<div class="pn">' + esc(m.price.tier) + '</div>' +
             '<div class="po">국내 공식 스토어 판매 페이지 등록 후 금액이 확정됩니다.</div></div>' +
             '<span class="pxp-tier" style="background:#fbf0d8;color:var(--pxp-warn);border-color:#eeddb4">가격 확인 중</span></div>';
    }
    var off = (m.price.normal && m.price.normal > m.price.now)
      ? '<s>' + won(m.price.normal) + '원</s> &nbsp;<b>' + m.price.off + '% 할인</b>' : '정상가 기준';
    return '<div class="pxp-price"><div><div class="pl">현재 공식 판매가</div>' +
           '<div class="pn">' + won(m.price.now) + '<span>원</span></div>' +
           '<div class="po">' + off + '</div></div>' +
           '<span class="pxp-tier">' + esc(m.price.tier) + '</span></div>';
  }

  /* 선정 근거 — 1단계(용도 적합도)와 2단계(가산점)를 나누어 설명 */
  function whyBox(r, top) {
    var t;
    if (r.simCount <= 1) {
      t = '고르신 조건에 <b>가장 잘 맞는 모니터</b>입니다.';
    } else if (r.boostKeys.length) {
      var names = r.boostKeys.map(function (k) { return BOOST_L[k]; }).join(" · ");
      t = '비슷하게 잘 맞는 <b>' + r.simCount + '개 모니터</b> 가운데 <em>' + esc(names) + '</em>을 우선해 골랐습니다.';
      if (r.boostKeys.indexOf("cost") >= 0 && top.m.price.now == null)
        t += ' <span style="color:var(--pxp-warn)">(이 모델은 판매가 준비 중이라 가격 비교에서는 빠졌습니다)</span>';
    } else {
      t = '비슷하게 잘 맞는 <b>' + r.simCount + '개 모니터</b> 가운데 <b>가격 부담이 가장 적은</b> 모델로 골랐습니다.';
    }
    return '<div class="pxp-why">' + t + '</div>';
  }

  /* 고르신 조건과 다른 결과가 나왔을 때, 그 이유를 결과 맨 위에 설명합니다. */
  function swapBox(sw, top) {
    if (!sw) return "";
    return '<div class="pxp-swap">' +
      '<div class="pxp-swap-t">' +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c8820f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M7 16V4M7 4L3 8M7 4l4 4"/><path d="M17 8v12M17 20l4-4M17 20l-4-4"/></svg>' +
      esc(sw.from) + '를 고르셨지만 <span style="color:#6b4f0c">' + esc(sw.to) + '</span> 모델을 추천드립니다</div>' +
      '<p>' + esc(sw.why) + '. 나머지 조건은 그대로 두고 ' + esc(sw.label) + '만 조정했습니다.</p></div>';
  }

  /* 구매 전 확인 — Ver2.5 '구매 전 확인' 시트의 모델별 고객 안내 문구 */
  function preBox(m, ans) {
    if (!m.pre || !m.pre.text) return "";
    var withConsole = ans && (ans.device === "both" || ans.device === "con");
    var important = m.pre.level === "중요 안내" || (withConsole && !m.consoleNative);
    var lead = (withConsole && !m.consoleNative) ? "콘솔도 함께 쓰신다면 꼭 확인해 주세요" : "구매 전 확인";
    return '<div class="pxp-pre' + (important ? ' is-important' : '') + '">' +
      '<div class="pxp-pre-t">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>' + esc(lead) + '</div>' +
      '<p>' + esc(m.pre.text) + '</p></div>';
  }

  function renderResult() {
    var r = score(state.ans), top = r.rows[0], dims = r.dims;
    var rest = r.rows.slice(1);
    var inAlts  = rest.filter(function (x) { return x.inPool; }).slice(0, 2);
    var outAlts = inAlts.length < 2
      ? rest.filter(function (x) { return !x.inPool; }).slice(0, 2 - inAlts.length) : [];
    var sw = r.swap;
    var chips = QUESTIONS.map(function (q) {
      var t = sumText(q);
      if (!t) return "";
      if (sw && ((sw.kind === "inch" && q.id === "inch") || (sw.kind === "res" && q.id === "res"))) {
        return '<span class="pxp-chip changed">' + esc(q.sum) + ' <s>' + esc(sw.from) + '</s> → <b>' + esc(sw.to) + '</b></span>';
      }
      return '<span class="pxp-chip">' + esc(q.sum) + ' <b>' + esc(t) + '</b></span>';
    }).join("");

    $("pxpProg").style.display = "none";
    $("pxpSide").style.display = "none";
    $("pxpBody").classList.add("is-wide");
    $("pxpTitle").innerHTML = '이 모니터를 <em>추천드립니다</em>';
    $("pxpSub").style.display = "none";

    var cond = (r.notes || []).map(function (t) {
      return '<div class="pxp-note"><strong>안내</strong> · ' + t + '</div>';
    }).join("");
    var weak = dims.filter(function (d) { return top.m.s[d] <= 2; });
    var note = weak.length
      ? '<div class="pxp-note"><strong>참고하세요</strong> · <strong>' +
        weak.map(function (d) { return DIM[d]; }).join(", ") +
        '</strong>은(는) 이 모니터의 강점은 아닙니다.</div>'
      : "";

    var h = '<div class="pxp-res"><div class="pxp-chips">' + chips + '</div>' +
      '<div class="pxp-res-tag">추천 모델</div><div class="pxp-card">' +
      swapBox(sw, top) +
      '<div><span class="pxp-badge">' + esc(top.m.badge) + '</span>' +
      (top.m.colorways >= 8 ? '<span class="pxp-badge col">' + top.m.colorways + '가지 컬러 선택</span>' : '') + '</div>' +
      '<div class="pxp-card-top"><div><h3 class="pxp-name">' + esc(top.m.name) + '</h3>' +
      '<p class="pxp-model">' + esc(top.m.series) + ' SERIES · ' + esc(top.m.id) + '</p></div>' +
      '<div class="pxp-fit"><div class="pxp-fit-n">' + top.fit + '<span style="font-size:16px">%</span></div>' +
      '<div class="pxp-fit-l">적합도</div></div></div>' +
      '<p class="pxp-hl">' + esc(top.m.headline) + '</p>' +
      '<p class="pxp-desc">' + esc(top.m.desc) + '</p>' +
      priceBox(top.m) + preBox(top.m, r.ans) + whyBox(r, top) +
      '<div class="pxp-specs">' + top.m.specs.map(function (s) { return '<span class="pxp-spec">' + esc(s) + '</span>'; }).join("") + '</div>' +
      bars(top.m, dims) + cond + note + '</div>';

    function altCard(a, out) {
      return '<div class="pxp-alt"><div class="pxp-alt-h"><div class="pxp-alt-n">' + esc(a.m.name) +
        (out ? ' <span style="font-size:10px;color:var(--pxp-l2)">' + esc(a.outWhy || "조건 외") + '</span>' : '') +
        '</div></div>' +
        '<div class="pxp-alt-p">' + (a.m.price.now == null ? '가격 확인 중' : won(a.m.price.now) + '원') +
        '<span>' + esc(a.m.price.tier) + (a.m.colorways >= 8 ? ' · 컬러 ' + a.m.colorways + '종' : '') + '</span></div>' +
        '<div class="pxp-alt-d">' + esc(a.m.short) + '</div>' +
        '<div class="pxp-alt-s">' + esc(a.m.specs.slice(0, 3).join(" · ")) + '</div></div>';
    }
    if (inAlts.length) {
      h += '<div class="pxp-alt-t">같은 조건에서 함께 고려할 만한 모델</div><div class="pxp-alts">' +
           inAlts.map(function (a) { return altCard(a, false); }).join("") + '</div>';
    }
    if (outAlts.length) {
      h += '<div class="pxp-alt-t" style="color:var(--pxp-warn)">조건을 조금 넓히면 고를 수 있는 모델</div>' +
           '<div class="pxp-alts">' + outAlts.map(function (a) { return altCard(a, true); }).join("") + '</div>' +
           '<p style="font-size:11.5px;color:var(--pxp-mute);margin-top:10px;line-height:1.6">' +
           '고르신 조건에서는 조금 벗어나지만, 함께 살펴보실 만한 모니터입니다.</p>';
    }

    h += '<div class="pxp-cta"><a class="pxp-btn pxp-btn-main" href="' + top.m.price.url + '" target="_blank" rel="noopener">' +
         esc(top.m.name) + ' 자세히 보기</a>' +
         '<button type="button" class="pxp-btn" data-act="again">다시 찾아보기</button></div>' +
         '<p class="pxp-foot">표시된 금액은 픽시오 공식 스토어 판매가이며, 프로모션에 따라 달라질 수 있습니다.</p></div>';

    $("pxpStage").innerHTML = h;
    state.ans = blank();          // 결과 산출 완료 → 응답 데이터 즉시 초기화 (저장하지 않음)

    $("pxpStage").querySelector('[data-act="again"]').addEventListener("click", function () {
      swap(function () { hardReset(); renderQ(); });
    });
    later(function () {
      $("pxpStage").querySelectorAll(".pxp-bar-f").forEach(function (el) {
        var w = el.style.width; el.style.width = "0"; requestAnimationFrame(function () { el.style.width = w; });
      });
    }, 60);
  }

  function hardReset() {
    clearTimers();
    state.step = 0; state.ans = blank(); state.busy = false;
    $("pxpTitle").innerHTML = HEAD.t;
    $("pxpSub").textContent = HEAD.s;
    $("pxpSub").style.display = "";
  }

  /* ========== 8. 팝업 제어 ========== */
  function open()  { hardReset(); renderQ(); $("pxpOverlay").classList.add("is-open"); document.body.style.overflow = "hidden"; }
  function close() { clearTimers(); state.busy = false; state.ans = blank(); $("pxpOverlay").classList.remove("is-open"); document.body.style.overflow = ""; }

  document.addEventListener("DOMContentLoaded", function () {
    $("pxpClose").addEventListener("click", close);
    $("pxpOverlay").addEventListener("click", function (e) { if (e.target === $("pxpOverlay")) close(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
    Array.prototype.forEach.call(document.querySelectorAll(".pxp-trigger"), function (b) {
      b.addEventListener("click", open);
    });
    var AUTO_OPEN = false;               // ← true 로 바꾸면 3초 뒤 자동 노출
    if (AUTO_OPEN) setTimeout(open, 3000);
    renderQ();
  });

  return { open:open, close:close, _score:score, _models:MODELS, _questions:QUESTIONS };
})();
</script>
<!-- ▲ 여기까지 복사 -->
</body>
</html>
