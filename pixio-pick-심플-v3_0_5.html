<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ff4200'/%3E%3Ctext x='32' y='47' font-family='Arial,Helvetica,sans-serif' font-size='44' font-weight='700' font-style='italic' text-anchor='middle' fill='%23fff'%3EP%3C/text%3E%3C/svg%3E">
<!--
====================================================================
  Pixio Pick!! — 심플형 (Ver 3.0 / 단일 HTML)
  기준 자료 : 픽시오 모니터 추천가이드 Ver3.0 (심플) — 2026-10-13 회의 결정 반영

  [Ver 3.0 주요 변경 — v2.8.1 대비]
  · 문항 9개 → 5~6개 (게임만 5 · 업무만 5 · 게임+업무 6)
  · USB-C 문항·점수 삭제 / 연결 기기 문항 삭제 → 콘솔은 게임 유형 선택지로 흡수
  · 게임 장르 7개(복수) → 게임 유형 4개(단일)
  · 해상도 문항 삭제 → 「화면에서 가장 중요한 것」 문항에 통합 (고객 화면에 FHD·QHD·4K 표기 없음)
  · 질문 서브타이틀·안내 문구 삭제, 오른쪽 「내가 선택한 조건」 패널 삭제
  · 결과 : 제품 2~3개를 같은 크기 카드로 + 선정 사유 1~2줄 + 「제품 보러 가기」
           하단에 「다시하기」 · 「상세 보기」 (상세 보기를 누른 고객에게만 조건·용도·확인 사항 표시)
  · 웨이브 시리즈가 결과에 1개라도 있으면 「함께 구매하면 좋은 상품」(모니터암·마우스패드·탑 쉘프·DP 2.1 케이블 이미지) 필수 노출
  · 2026-10-14 : 결과 카드의 모니터 이미지와 연관 상품 이미지에 마우스를 올리면 살짝 확대 (연관 상품 링크는 판매 시작 후 ACC 의 url 에 입력)
  · 2026-10-14 : 예산 문항을 금액 구간 → 「가격에 대한 생각」 3개 선택지로 변경 (가격 우선 / 상관없음 / 잘 모르겠음)
                 금액 상한으로 후보를 빼지 않고, 가격은 앞 문항 조건에 맞는 모델들 사이의 순서에만 반영합니다.
                 문항을 빼려면 아래 USE_PRICE 값을 false 로 바꾸면 됩니다. (빼면 「가격은 상관없어요」와 같게 계산)

  [추천 계산 — 가이드 Ver3.2 「추천 규칙」과 동일 · 2026-10-14 재설정]
  1) 필터 : 판매 중 · 콘솔 게임 선택 시 콘솔 활용 3점 미만 제외
  2) 총점 = 용도 점수 × 0.6 + 화면 우선순위 점수 × 0.4
  3) 조건 일치 = 용도 점수 3.5 이상 + 화면 우선순위 점수 3.0 이상
  4) 묶음 순서 : 고른 크기·조건 일치 → 고른 크기·조건 불일치 → 다른 크기·조건 일치 → 나머지
  5) 묶음 안에서만 가격 반영 (가격 우선 0.6 · 잘 모르겠음 0.3 · 상관없음 0)
     가격 우선이면 70만 원 이상 모델은 묶음 맨 뒤 / 잘 모르겠음은 3번째 자리에 「가격 부담이 적은 선택」
  6) 상위 3개 표시

  [홈페이지 삽입 방법]
  · <div id="pxp-root"> 블록, <style id="pxp-style">, <script id="pxp-script"> 3개만 복사합니다.
  · 열기 : onclick="PXP.open()" 또는 class="pxp-trigger" / 닫기 : PXP.close()
  · 모든 CSS는 #pxp-root 하위로만 적용되어 기존 페이지와 충돌하지 않습니다.
  · 응답은 페이지 메모리에서만 다루며 쿠키·localStorage·서버 전송을 쓰지 않습니다.
    결과가 나오는 즉시 응답을 초기화합니다.

  [신제품 추가]
  · 아래 MODELS 배열에 같은 형식으로 한 덩어리를 추가하면 됩니다. (가이드 「제품 정보」·「용도 점수」·「결과 문구」 시트와 같은 항목)
  · 웨이브 시리즈(series:"Wave")는 자동으로 연관 상품 노출 대상이 됩니다.
====================================================================
-->
<style id="pxp-style">
@import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT.css');
@font-face{ font-family:'Artific'; src:url('https://hameetoy.speedgabia.com/pixio/pixiogaming/common/font/Artific-Regular.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }
@font-face{ font-family:'Artific'; src:url('https://hameetoy.speedgabia.com/pixio/pixiogaming/common/font/Artific-Bold.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:swap; }

#pxp-root, #pxp-root *, #pxp-root *::before, #pxp-root *::after{ box-sizing:border-box; }
#pxp-root{
  --pxp-ink:#111; --pxp-point:#ff4200; --pxp-point-d:#e03900; --pxp-mid:#9a9a9a; --pxp-soft:#e2e2e2;
  --pxp-mute:#8a8a8a; --pxp-bg:#f4f4f5; --pxp-card:#fff; --pxp-head:#fafafa; --pxp-tint:#fff5f1;
  font-family:'Artific','SUIT','SUIT Variable',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#pxp-root .pxp-overlay{ position:fixed; inset:0; z-index:99999; display:none; background:rgba(0,0,0,.55); padding:22px 14px; overflow-y:auto; }
#pxp-root .pxp-overlay.is-open{ display:block; animation:pxpFade .2s ease both; }
@keyframes pxpFade{from{opacity:0}to{opacity:1}}
@keyframes pxpUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pxpIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#pxp-root .pxp-modal{ position:relative; width:100%; max-width:820px; margin:0 auto; background:var(--pxp-bg);
  border:1px solid var(--pxp-ink); color:var(--pxp-ink); animation:pxpUp .26s cubic-bezier(.2,.7,.3,1) both; overflow:hidden;
  text-align:left; line-height:1.5; letter-spacing:-.2px; }
#pxp-root .pxp-modal::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--pxp-point); }
#pxp-root .pxp-x{ position:absolute; top:16px; right:14px; width:32px; height:32px; background:#fff; border:1px solid var(--pxp-ink);
  color:var(--pxp-ink); font-size:17px; line-height:1; cursor:pointer; font-family:inherit; transition:.12s; z-index:2; }
#pxp-root .pxp-x:hover{ background:var(--pxp-ink); color:#fff; }
/* 머리말 */
#pxp-root .pxp-head{ padding:22px 24px 18px; border-bottom:1px solid var(--pxp-ink); background:#fff; }
#pxp-root .pxp-hrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-right:40px; }
#pxp-root .pxp-logo{ height:28px; width:auto; display:block; }
#pxp-root .pxp-brand-fb{ font-size:26px; font-weight:900; letter-spacing:-1px; font-style:italic; display:none; }
#pxp-root .pxp-doc{ font-size:28px; line-height:28px; font-weight:800; letter-spacing:-1.5px; font-style:italic; }
#pxp-root .pxp-doc em{ font-style:italic; color:var(--pxp-point); }
#pxp-root .pxp-title{ margin:16px 0 0; font-size:21px; font-weight:800; letter-spacing:-.8px; line-height:1.35; }
#pxp-root .pxp-title em{ font-style:normal; color:var(--pxp-point); }
#pxp-root .pxp-sub{ margin:6px 0 0; font-size:13px; color:var(--pxp-mute); }
#pxp-root .pxp-sub:empty{ display:none; }
#pxp-root .pxp-head.is-result{ padding-top:16px; padding-bottom:14px; }
#pxp-root .pxp-head.is-result .pxp-title, #pxp-root .pxp-head.is-result .pxp-sub{ display:none; }
#pxp-root .pxp-body{ padding:20px 24px 24px; }
/* 진행바 */
#pxp-root .pxp-prog{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
#pxp-root .pxp-prog-bar{ flex:1; height:6px; background:var(--pxp-soft); overflow:hidden; }
#pxp-root .pxp-prog-fill{ height:100%; width:0; background:var(--pxp-point); transition:width .35s cubic-bezier(.3,.8,.3,1); }
#pxp-root .pxp-prog-txt{ font-size:11.5px; font-weight:800; color:var(--pxp-mute); white-space:nowrap; }
/* 문항 */
#pxp-root .pxp-sheet{ background:var(--pxp-card); border:1px solid var(--pxp-ink); }
#pxp-root .pxp-sec-head{ padding:14px 16px; border-bottom:1px solid var(--pxp-ink); background:var(--pxp-head); }
#pxp-root .pxp-sec-head h3{ margin:0; font-size:18px; font-weight:800; letter-spacing:-.6px; line-height:1.35; }
#pxp-root .pxp-sec-body{ padding:16px; }
#pxp-root #pxpStage{ transition:opacity .17s ease, transform .17s ease; }
#pxp-root #pxpStage.is-out{ opacity:0; transform:translateY(-8px); }
#pxp-root .pxp-q{ animation:pxpIn .26s ease both; }
#pxp-root .pxp-opts{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
#pxp-root .pxp-opts.is-3{ grid-template-columns:repeat(3,1fr); }
#pxp-root .pxp-opt{ position:relative; display:flex; align-items:center; gap:12px; width:100%; min-height:64px; text-align:left;
  padding:12px 14px; background:#fff; border:1px solid var(--pxp-mid); color:var(--pxp-ink); cursor:pointer; font-family:inherit; transition:.12s; }
#pxp-root .pxp-opts.is-3 .pxp-opt{ flex-direction:column; justify-content:center; text-align:center; gap:9px; min-height:116px; }
#pxp-root .pxp-opt:hover{ border-color:var(--pxp-ink); }
#pxp-root .pxp-opt.is-sel{ border-color:var(--pxp-point); background:var(--pxp-tint); box-shadow:inset 0 0 0 1px var(--pxp-point); }
#pxp-root .pxp-ic{ flex:0 0 40px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:var(--pxp-ink); }
#pxp-root .pxp-ic svg{ width:32px; height:32px; }
#pxp-root .pxp-opt.is-sel .pxp-ic{ color:var(--pxp-point); }
#pxp-root .pxp-txt{ min-width:0; }
#pxp-root .pxp-opt-l{ display:block; font-size:14.5px; font-weight:800; letter-spacing:-.4px; word-break:keep-all; line-height:1.35; }
#pxp-root .pxp-opt-d{ display:block; margin-top:3px; font-size:12px; color:var(--pxp-mute); word-break:keep-all; }
#pxp-root .pxp-opt .pxp-mk{ position:absolute; top:8px; right:8px; width:18px; height:18px; border:1px solid var(--pxp-soft); background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; }
#pxp-root .pxp-opt.is-sel .pxp-mk{ background:var(--pxp-point); border-color:var(--pxp-point); }
#pxp-root .pxp-opt.is-dim{ background:#fafafa; border-color:#dedede; }
#pxp-root .pxp-opt.is-dim .pxp-opt-l, #pxp-root .pxp-opt.is-dim .pxp-ic{ color:#b0b0b0; }
#pxp-root .pxp-opt.is-dim .pxp-opt-d{ color:#c8c8c8; }
#pxp-root .pxp-opt.is-dim:hover{ background:#fff; border-color:var(--pxp-ink); }
#pxp-root .pxp-opt.is-dim:hover .pxp-opt-l, #pxp-root .pxp-opt.is-dim:hover .pxp-ic{ color:var(--pxp-ink); }
#pxp-root .pxp-nav{ display:flex; gap:10px; margin-top:16px; }
#pxp-root .pxp-btn{ padding:15px 20px; font-size:15.5px; font-weight:800; letter-spacing:-.4px; cursor:pointer; border:1px solid var(--pxp-ink);
  background:#fff; color:var(--pxp-ink); font-family:inherit; transition:.12s; text-align:center; text-decoration:none; display:block; }
#pxp-root .pxp-btn:hover{ background:#efefef; }
#pxp-root .pxp-btn-main{ flex:1; border-color:var(--pxp-point); background:var(--pxp-point); color:#fff; }
#pxp-root .pxp-btn-main:hover{ background:var(--pxp-point-d); border-color:var(--pxp-point-d); color:#fff; }
#pxp-root .pxp-btn-main:disabled{ opacity:.45; cursor:not-allowed; background:var(--pxp-point); border-color:var(--pxp-point); }
#pxp-root .pxp-nav .pxp-btn:not(.pxp-btn-main){ flex:0 0 30%; }
/* 로딩 */
#pxp-root .pxp-load{ padding:40px 20px 36px; text-align:center; animation:pxpIn .3s ease both; }
#pxp-root .pxp-wave{ display:flex; justify-content:center; align-items:flex-end; gap:1px; font-size:46px; font-weight:800; letter-spacing:-2px; line-height:1.1; height:64px; }
#pxp-root .pxp-wave i{ font-style:normal; display:inline-block; color:var(--pxp-ink); animation:pxpWave 1.5s cubic-bezier(.35,.1,.35,1) infinite; animation-delay:calc(var(--i) * .075s); }
#pxp-root .pxp-wave i.pt{ color:var(--pxp-point); }
#pxp-root .pxp-wave i.sp{ width:.28em; }
@keyframes pxpWave{ 0%,55%,100%{ transform:translateY(0) } 26%{ transform:translateY(-16px) } }
#pxp-root .pxp-lbar{ width:min(360px,86%); height:8px; margin:26px auto 0; background:var(--pxp-soft); overflow:hidden; }
#pxp-root .pxp-lbar-f{ height:100%; width:0; background:var(--pxp-point); transition:width .12s linear; }
#pxp-root .pxp-lpct{ margin-top:11px; font-size:26px; font-weight:800; letter-spacing:-1.2px; }
#pxp-root .pxp-lpct span{ font-size:13px; font-weight:700; margin-left:1px; color:var(--pxp-point); }
#pxp-root .pxp-load-s{ font-size:12.5px; color:var(--pxp-mute); margin-top:8px; min-height:19px; }
/* 결과 카드 */
#pxp-root .pxp-res{ animation:pxpIn .3s ease both; }
#pxp-root .pxp-res-t{ margin:0 0 12px; font-size:19px; font-weight:800; letter-spacing:-.7px; }
#pxp-root .pxp-res-t em{ font-style:normal; color:var(--pxp-point); }
#pxp-root .pxp-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
#pxp-root .pxp-cards.is-2{ grid-template-columns:repeat(2,1fr); }
#pxp-root .pxp-card{ display:flex; flex-direction:column; background:#fff; border:1px solid var(--pxp-ink); padding:14px 14px 14px; }
#pxp-root .pxp-shot{ border:1px solid var(--pxp-soft); background:#fcfcfc; padding:10px; margin-bottom:12px; overflow:hidden; transition:border-color .2s; }
#pxp-root .pxp-shot:hover{ border-color:var(--pxp-ink); }
#pxp-root .pxp-shot.is-off{ display:none; }
#pxp-root .pxp-shot img{ display:block; width:100%; height:150px; object-fit:contain; transition:transform .35s cubic-bezier(.2,.7,.3,1); }
#pxp-root .pxp-shot:hover img{ transform:scale(1.1); }
#pxp-root .pxp-name{ margin:0; font-size:16px; font-weight:800; letter-spacing:-.5px; line-height:1.3; }
#pxp-root .pxp-line{ margin:5px 0 0; font-size:12px; font-weight:700; color:var(--pxp-mute); }
#pxp-root .pxp-why{ flex:1 1 auto; margin:11px 0 0; padding-top:10px; border-top:1px solid var(--pxp-soft); }
#pxp-root .pxp-why p{ margin:0; font-size:13px; line-height:1.65; color:#3a3a3a; word-break:keep-all; }
#pxp-root .pxp-why p + p{ margin-top:5px; }
#pxp-root .pxp-flag{ display:inline-block; align-self:flex-start; margin-top:9px; padding:3px 8px; font-size:11px; font-weight:800; color:#a33000; background:var(--pxp-tint); border:1px solid var(--pxp-point); }
#pxp-root .pxp-go{ display:block; margin-top:12px; padding:11px 10px; text-align:center; font-size:13px; font-weight:800; letter-spacing:-.3px;
  text-decoration:none; color:#fff; background:var(--pxp-ink); border:1px solid var(--pxp-ink); transition:.12s; }
#pxp-root .pxp-go:hover{ background:var(--pxp-point); border-color:var(--pxp-point); }
/* 함께 구매하면 좋은 상품 */
#pxp-root .pxp-acc{ margin-top:14px; background:#fff; border:1px solid var(--pxp-ink); }
#pxp-root .pxp-acc-h{ padding:12px 14px; border-bottom:1px solid var(--pxp-ink); background:var(--pxp-head); }
#pxp-root .pxp-acc-h h4{ margin:0; font-size:15px; font-weight:800; letter-spacing:-.5px; }
#pxp-root .pxp-acc-b{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:14px; }
#pxp-root .pxp-acc-i{ display:block; overflow:hidden; border:1px solid var(--pxp-soft); background:#fff; transition:border-color .2s; }
#pxp-root a.pxp-acc-i{ cursor:pointer; }
#pxp-root .pxp-acc-i img{ display:block; width:100%; height:220px; object-fit:contain; transition:transform .35s cubic-bezier(.2,.7,.3,1); }
#pxp-root .pxp-acc-i:hover{ border-color:var(--pxp-ink); }
#pxp-root .pxp-acc-i:hover img{ transform:scale(1.08); }
/* 하단 버튼 · 상세 보기 */
#pxp-root .pxp-cta{ display:flex; gap:10px; margin-top:14px; }
#pxp-root .pxp-cta .pxp-btn{ flex:1; padding:11px 10px; font-size:13px; letter-spacing:-.3px; }
#pxp-root .pxp-cta .pxp-btn[aria-expanded="true"]{ background:var(--pxp-ink); color:#fff; }
#pxp-root .pxp-fold{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s cubic-bezier(.3,.8,.3,1); }
#pxp-root .pxp-fold.is-open{ grid-template-rows:1fr; }
#pxp-root .pxp-fold-in{ overflow:hidden; min-height:0; }
#pxp-root .pxp-more{ margin-top:12px; background:#fff; border:1px solid var(--pxp-ink); }
#pxp-root .pxp-more-s{ padding:14px 16px; border-bottom:1px solid var(--pxp-soft); }
#pxp-root .pxp-more-s:last-child{ border-bottom:none; }
#pxp-root .pxp-more-t{ font-size:13px; font-weight:800; letter-spacing:-.3px; margin-bottom:8px; }
#pxp-root .pxp-chips{ display:flex; flex-wrap:wrap; gap:6px; }
#pxp-root .pxp-chip{ padding:5px 10px; font-size:12px; font-weight:700; color:#5a5a5a; background:#fff; border:1px solid var(--pxp-soft); }
#pxp-root .pxp-chip b{ color:var(--pxp-ink); font-weight:800; }
#pxp-root .pxp-dl{ margin:0; }
#pxp-root .pxp-dl dt{ font-size:13.5px; font-weight:800; letter-spacing:-.4px; }
#pxp-root .pxp-dl dd{ margin:4px 0 0; font-size:12.8px; line-height:1.65; color:#4a4a4a; }
#pxp-root .pxp-dl dd span{ display:inline-block; min-width:90px; margin-right:6px; font-weight:800; color:var(--pxp-mute); }
#pxp-root .pxp-dl dd.chk span{ color:var(--pxp-point); }
#pxp-root .pxp-dl dt + dd{ margin-top:6px; }
#pxp-root .pxp-dl dd + dt{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--pxp-soft); }
#pxp-root .pxp-foot{ margin:14px 0 0; font-size:11px; color:var(--pxp-mute); line-height:1.6; text-align:center; }
/* 개인정보 */
#pxp-root .pxp-privacy{ display:flex; align-items:flex-start; gap:11px; padding:13px 24px; border-top:1px solid var(--pxp-ink); background:var(--pxp-head); }
#pxp-root .pxp-privacy svg{ flex:0 0 auto; margin-top:1px; }
#pxp-root .pxp-privacy p{ margin:0; font-size:12px; line-height:1.65; color:#5a5a5a; }
#pxp-root .pxp-privacy b{ color:var(--pxp-point); font-weight:800; }
@media (max-width:720px){
  #pxp-root .pxp-cards, #pxp-root .pxp-cards.is-2{ grid-template-columns:1fr; }
  #pxp-root .pxp-shot img{ height:130px; }
  #pxp-root .pxp-acc-b{ grid-template-columns:repeat(2,1fr); }
  #pxp-root .pxp-acc-i img{ height:180px; }
}
@media (max-width:620px){
  #pxp-root .pxp-overlay{ padding:12px 10px; }
  #pxp-root .pxp-head{ padding:20px 16px 16px; } #pxp-root .pxp-body{ padding:16px 16px 20px; }
  #pxp-root .pxp-privacy{ padding:12px 16px; }
  #pxp-root .pxp-logo{ height:24px; } #pxp-root .pxp-doc{ font-size:22px; line-height:22px; }
  #pxp-root .pxp-title{ font-size:18px; }
  #pxp-root .pxp-opts{ grid-template-columns:1fr; }
  #pxp-root .pxp-opts.is-3{ grid-template-columns:1fr; }
  #pxp-root .pxp-opts.is-3 .pxp-opt{ flex-direction:row; text-align:left; min-height:64px; }
  #pxp-root .pxp-wave{ font-size:34px; height:48px; }
  #pxp-root .pxp-cta{ flex-direction:column-reverse; }
}
@media (prefers-reduced-motion: reduce){ #pxp-root .pxp-fold{ transition:none; } #pxp-root .pxp-shot:hover img, #pxp-root .pxp-acc-i:hover img{ transform:none; } #pxp-root .pxp-wave i{ animation:none; } }

                {v:"gfx",  l:"그래픽이 화려한 게임", d:"RPG · 오픈월드 · 레이싱", ic:"gfx", sl:"그래픽 게임"},

                {v:"s32", l:"32인치", ic:"s32"}, {v:"s34", l:"34인치 와이드", ic:"s34"},
                {v:"any", l:"잘 모르겠어요", ic:"any", sl:"추천에 맡김"} ]},
    prio:{ id:"prio", type:"single", sum:"중요한 점", title:"화면에서 가장 중요한 건 뭐예요?",
      options:[ {v:"speed",   l:"빠른 반응과 부드러운 움직임", ic:"speed", sl:"반응 속도"},
                {v:"quality", l:"선명한 화질과 풍부한 색감", ic:"quality", sl:"화질·색감"},
                {v:"big",     l:"크고 넓게 보이는 화면", ic:"big", sl:"큰 화면"},
                {v:"design",  l:"내 책상에 어울리는 디자인·컬러", ic:"design", sl:"디자인·컬러"} ]},

  /* 응답에 따라 이번에 보여 줄 문항 순서 — 게임만 5 · 업무만 5 · 둘 다 6 (가격 문항 미사용 시 1개씩 감소) */
  function flow(a) {
    var p = a.purpose || "game", f = ["purpose"];
    if (p === "game" || p === "both") f.push("genre");
    if (p === "work" || p === "both") f.push("work");
    f.push("inch", "prio");
    if (USE_PRICE) f.push("price");
    return f;
  }

  /* ========== 3. 추천 계산 (가이드 「추천 규칙」) ========== */
  function avg(a) { var t = 0; a.forEach(function (x) { t += x; }); return t / a.length; }
  function speedScore(m) { var r = m.refresh; return r >= 360 ? 5 : r >= 240 ? 4.5 : r >= 200 ? 4 : r >= 165 ? 3.5 : 3; }
  var G_SCORE = {
    comp:function (m) { return m.s.fps; },
    gfx: function (m) { return avg([m.s.aaa, m.s.dark, m.s.race]); },
    con: function (m) { return m.s.con; },
    all: function (m) { return avg([m.s.fps, m.s.moba, m.s.aaa]); }
  };
  var W_SCORE = { doc:"doc", multi:"multi", photo:"photo", video:"video", web:"hdr" };
  var P_SCORE = {
    speed:  speedScore,
    quality:function (m) { return avg([m.s.hires, m.s.photo, m.s.dark]); },
    big:    function (m) { return avg([m.s.multi, m.s.race]); },
    design: function (m) { return m.s.deco; }
  };
  function sizeOk(m, v) {
    if (v === "s24") return m.inch <= 25;
    if (v === "s27") return m.inch === 27;
    if (v === "s32") return m.inch === 32;
    if (v === "s34") return m.inch === 34;
    return true;
  }
  function r2(x) { return Math.round(x * 100) / 100; }

  /* 추천 순서 (가이드 Ver3.2 「추천 규칙」)
     ① 조건 일치 판정 : 용도 점수 3.5 이상(잘 맞음) + 화면 우선순위 점수 3.0 이상(무난 이상)
     ② 묶음 순서     : [고른 크기 · 조건 일치] → [고른 크기 · 조건 불일치] → [다른 크기 · 조건 일치] → [나머지]
                       고른 크기는 항상 먼저 보여 드립니다 (Ver3.0 크기 우선 원칙 유지).
     ③ 묶음 안 순서  : 조건 일치 묶음은 최종 점수 = 총점 + 가격 반영 강도 × (예산 접근성 − 3) ÷ 2
                       조건 불일치 묶음은 가격을 반영하지 않고 총점 순서만 씁니다.
                       가격은 묶음 안에서만 순서를 바꾸므로, 앞 문항과 맞지 않는 모델이 가격만으로 올라오지 않습니다.
     ④ 가격 우선이면 70만 원 이상(예산 접근성 1점) 모델은 같은 묶음의 맨 뒤로 보냅니다.
     ⑤ 잘 모르겠음은 3번째 자리에 「가격 부담이 적은 선택」을 둡니다 (원래 3번째 모델과 같은 묶음의 조건 일치 모델 중).                            */
  var USE_MIN = 3.5, PRI_MIN = 3.0;
  var PRICE_W = { value:0.6, unsure:0.3, any:0 };      // 가격 반영 강도

  function recommend(a) {
    var p = a.purpose, rows = [], price = USE_PRICE ? a.price : "any", w = PRICE_W[price] || 0;
    MODELS.forEach(function (m) {
      if (p !== "work" && a.genre === "con" && m.s.con < 3) return;        // 콘솔 게임 : 콘솔에서 제 화면을 못 쓰는 모델 제외
      var parts = [];
      if (p === "game" || p === "both") parts.push(G_SCORE[a.genre](m));
      if (p === "work" || p === "both") parts.push(avg(a.work.map(function (x) { return m.s[W_SCORE[x]]; })));
      var use = avg(parts), pri = P_SCORE[a.prio](m), total = r2(use * 0.6 + pri * 0.4);
      rows.push({ m:m, total:total, size:sizeOk(m, a.inch), ok: use >= USE_MIN && pri >= PRI_MIN,
                  score: r2(total + w * (m.s.budget - 3) / 2) });
    });
    var bySpeed = a.prio === "speed";
    function tie(x, y) {
      if (y.total !== x.total) return y.total - x.total;
      if (bySpeed && y.m.refresh !== x.m.refresh) return y.m.refresh - x.m.refresh;
      if (y.m.s.budget !== x.m.s.budget) return y.m.s.budget - x.m.s.budget;
      return y.m.refresh - x.m.refresh;
    }
    function byScore(x, y) {
      if (price === "value") { var px = x.m.s.budget === 1, py = y.m.s.budget === 1; if (px !== py) return px ? 1 : -1; }
      return (y.score - x.score) || tie(x, y);
    }
    function pick(f, cmp) { return rows.filter(f).sort(cmp); }
    var T0 = pick(function (r) { return r.ok && r.size; }, byScore),
        T1 = pick(function (r) { return r.ok && !r.size; }, byScore),
        T2 = pick(function (r) { return !r.ok && r.size; }, tie),
        T3 = pick(function (r) { return !r.ok && !r.size; }, tie);
    var list = T0.concat(T2, T1, T3);
    /* 잘 모르겠음 : 3번째 자리에 「가격 부담이 적은 선택」 하나 */
    if (price === "unsure" && list.length > 3) {
      var head = list.slice(0, 2), restL = list.slice(2);
      var hiB = Math.max(head[0].m.s.budget, head[1].m.s.budget);
      var grp = [T0, T2, T1, T3].filter(function (g) { return g.indexOf(restL[0]) >= 0; })[0];
      var cand = restL.filter(function (r) { return r.ok && grp.indexOf(r) >= 0 && r.m.s.budget > hiB; })
                      .sort(function (x, y) { return (y.m.s.budget - x.m.s.budget) || tie(x, y); })[0];
      if (cand) { cand.value = true; list = head.concat([cand], restL.filter(function (r) { return r !== cand; })); }
    }
    return list.slice(0, 3);
  }

  /* ========== 4. 화면 ========== */
  var HEAD = { t:'나에게 맞는 픽시오는 <em>어떤 모델일까요?</em>', s:"" };
  function blank() { return { purpose:null, genre:null, work:[], inch:null, prio:null, price:null }; }
  var state = { step:0, ans:blank(), busy:false, timers:[] };
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function clearTimers() { state.timers.forEach(function (t) { clearTimeout(t); clearInterval(t); }); state.timers = []; }
  function later(fn, ms) { var t = setTimeout(fn, ms); state.timers.push(t); return t; }
  function optOf(q, v) { for (var i = 0; i < q.options.length; i++) if (q.options[i].v === v) return q.options[i]; return null; }
  function curQ() { return Q[flow(state.ans)[state.step]]; }

  function swap(build, outMs) {
    if (state.busy) return;
    state.busy = true;
    var st = $("pxpStage"), h0 = st.offsetHeight;
    st.style.height = h0 + "px"; st.style.overflow = "hidden";
    st.classList.add("is-out");
    later(function () {
      build();
      var h1 = st.scrollHeight;
      st.classList.remove("is-out");
      st.style.transition = "height .3s cubic-bezier(.3,.8,.3,1)";
      requestAnimationFrame(function () { st.style.height = h1 + "px"; });
      state.busy = false;
      later(function () { st.style.height = ""; st.style.overflow = ""; st.style.transition = ""; }, 320);
    }, outMs || 160);
  }
  function goStep(n) { swap(function () { state.step = n; renderQ(); }); }

  function isSel(q, v) { var c = state.ans[q.id]; return q.type === "single" ? c === v : c.indexOf(v) >= 0; }
  function isDone(q) { var c = state.ans[q.id]; return q.type === "single" ? c !== null : c.length > 0; }

  function renderQ() {
    var q = curQ(), f = flow(state.ans);
    $("pxpProg").style.display = "flex";
    $("pxpProgFill").style.width = ((state.step + 1) / f.length * 100) + "%";
    $("pxpProgTxt").textContent = (state.step + 1) + " / " + f.length;
    var h = '<div class="pxp-q"><div class="pxp-sheet"><div class="pxp-sec-head"><h3>' + esc(q.title) + '</h3></div>' +
            '<div class="pxp-sec-body"><div class="pxp-opts' + (q.cols === 3 ? " is-3" : "") + '">';
    q.options.forEach(function (o) {
      h += '<button type="button" class="pxp-opt" data-v="' + o.v + '">' + icon(o.ic) +
           '<span class="pxp-txt"><span class="pxp-opt-l">' + esc(o.l) + '</span>' +
           (o.d ? '<span class="pxp-opt-d">' + esc(o.d) + '</span>' : '') + '</span>' +
           (q.type === "multi" ? '<span class="pxp-mk" aria-hidden="true"></span>' : '') + '</button>';
    });
    h += '</div></div></div><div class="pxp-nav">' +
         (state.step > 0 ? '<button type="button" class="pxp-btn" data-act="prev">이전</button>' : '') +

    $("pxpStage").innerHTML = h;
    $("pxpStage").querySelectorAll(".pxp-opt").forEach(function (b) {
      b.addEventListener("click", function () { pick(q, b.getAttribute("data-v")); });
    });
    $("pxpStage").querySelectorAll("[data-act]").forEach(function (b) {
      b.addEventListener("click", function () { if (b.getAttribute("data-act") === "next") next(); else goStep(state.step - 1); });
    });

  }
  function mark(q) {
    var full = q.type === "single" && isDone(q);
    $("pxpStage").querySelectorAll(".pxp-opt").forEach(function (b) {
      var s = isSel(q, b.getAttribute("data-v"));
      b.classList.toggle("is-sel", s);
      b.classList.toggle("is-dim", full && !s);
      b.setAttribute("aria-pressed", s ? "true" : "false");
      var mk = b.querySelector(".pxp-mk"); if (mk) mk.textContent = s ? "✓" : "";
    });
    $("pxpStage").querySelector('[data-act="next"]').disabled = !isDone(q);
    var f = flow(state.ans);                          // 용도에 따라 전체 문항 수가 바뀌므로 진행 표시도 갱신
    $("pxpProgTxt").textContent = (state.step + 1) + " / " + f.length;
    $("pxpProgFill").style.width = ((state.step + 1) / f.length * 100) + "%";
    var nx = $("pxpStage").querySelector('[data-act="next"]');
    nx.textContent = state.step === f.length - 1 ? "결과 보기" : "다음";
  }
  function pick(q, v) {
    if (state.busy) return;
    if (q.type === "single") { state.ans[q.id] = v; mark(q); return; }   // 단일 선택은 '다음'을 눌러야 넘어갑니다
    var o = optOf(q, v), arr = state.ans[q.id].slice();
    if (o.ex) arr = arr.indexOf(v) >= 0 ? [] : [v];
    else {
      arr = arr.filter(function (x) { return !optOf(q, x).ex; });
      arr = arr.indexOf(v) >= 0 ? arr.filter(function (x) { return x !== v; }) : arr.concat([v]);
    }
    state.ans[q.id] = arr; mark(q);
  }
  function next() {
    if (state.step === flow(state.ans).length - 1) renderLoading();
    else goStep(state.step + 1);
  }

  /* ---------- 대기 화면 ---------- */
  function renderLoading() {
    swap(function () {
      $("pxpProg").style.display = "none";
      $("pxpTitle").innerHTML = '잘 맞는 모니터를 <em>찾고 있어요</em>';
      $("pxpSub").textContent = "잠시만 기다려 주세요.";
      var wave = "Pixio Pick!!".split("").map(function (ch, i) {
        if (ch === " ") return '<i class="sp" style="--i:' + i + '"></i>';
        return '<i class="' + (i >= 6 ? "pt" : "") + '" style="--i:' + i + '">' + ch + '</i>';
      }).join("");
      $("pxpStage").innerHTML = '<div class="pxp-sheet"><div class="pxp-load"><div class="pxp-wave" aria-label="Pixio Pick">' + wave + '</div>' +
        '<div class="pxp-lbar"><div class="pxp-lbar-f" id="pxpBar"></div></div><div class="pxp-lpct" id="pxpPct">0<span>%</span></div>' +
        '<div class="pxp-load-s" id="pxpTick"></div></div></div>';
      var t0 = Date.now(), mi = 0;
      var iv = setInterval(function () {
        var p = Math.min(1, (Date.now() - t0) / LOAD_MS), shown = Math.round((1 - Math.pow(1 - p, 1.35)) * 100);
        $("pxpPct").innerHTML = shown + '<span>%</span>'; $("pxpBar").style.width = shown + "%";
        if (p >= 1) clearInterval(iv);
      }, 40);
      var iv2 = setInterval(function () { $("pxpTick").textContent = MODELS[mi++ % MODELS.length].name; }, 260);
      state.timers.push(iv, iv2);
      later(function () { clearInterval(iv2); swap(renderResult, 220); }, LOAD_MS + 150);
    });
  }

  /* ---------- 결과 ---------- */
  function accBlock() {
    var list = ACC.map(function (x) {
      var inner = '<img src="' + x.img + '" alt="' + esc(x.name) + '" loading="lazy" decoding="async">';
      return x.url
        ? '<a class="pxp-acc-i" href="' + x.url + '" target="_blank" rel="noopener" title="' + esc(x.name) + '">' + inner + '</a>'
        : '<div class="pxp-acc-i" title="' + esc(x.name) + '">' + inner + '</div>';
    }).join("");
    return '<div class="pxp-acc"><div class="pxp-acc-h"><h4>함께 구매하면 좋은 상품</h4></div><div class="pxp-acc-b">' + list + '</div></div>';
  }
  function bindShots(root) {
    root.querySelectorAll("img.pxp-img").forEach(function (im) {
      function fail() { im.parentNode.className += " is-off"; }
      im.addEventListener("error", fail);
      if (im.complete && im.naturalWidth === 0) fail();
    });
  }

  function renderResult() {
    var a = state.ans, f = flow(a);
    if (a.purpose === "game") a.work = [];               // 앞에서 바꾼 답이 남아 있어도 이번 경로의 답만 씁니다
    if (a.purpose === "work") a.genre = null;
    var list = recommend(a);
    var anyWave = list.some(function (r) { return r.m.series === "Wave"; });
    $("pxpProg").style.display = "none";
    $("pxpHead").classList.add("is-result");
    $("pxpTitle").textContent = "추천 결과";

    var cards = list.map(function (r) {
      var m = r.m, why = [];
      if (a.purpose !== "work") why.push(m.game);
      if (a.purpose !== "game") why.push(m.work);
      return '<div class="pxp-card">' +
        '<div class="pxp-shot"><img class="pxp-img" src="' + m.img + '" alt="' + esc(m.name) + '" decoding="async"></div>' +
        '<h3 class="pxp-name">' + esc(m.name) + '</h3><p class="pxp-line">' + esc(m.line) + '</p>' +
        '<div class="pxp-why">' + why.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join("") + '</div>' +
        (r.value ? '<span class="pxp-flag">가격 부담이 적은 선택</span>' : '') +
        '<a class="pxp-go" href="' + m.url + '" target="_blank" rel="noopener">제품 보러 가기</a></div>';
    }).join("");

    var chips = f.map(function (id) {
      var q = Q[id], v = a[id], t;
      if (q.type === "single") { var o = optOf(q, v); t = o ? (o.sl || o.l) : ""; }
      else t = v.map(function (x) { var o = optOf(q, x); return o.sl || o.l; }).join(", ");
      return '<span class="pxp-chip">' + esc(q.sum) + ' <b>' + esc(t) + '</b></span>';
    }).join("");
    var detail = list.map(function (r) {
      return '<dt>' + esc(r.m.name) + '</dt><dd><span>잘 맞는 용도</span>' + esc(r.m.fit) + '</dd>' +
             '<dd class="chk"><span>확인해 주세요</span>' + esc(r.m.check) + '</dd>';
    }).join("");

    var h = '<div class="pxp-res">' +
      '<h3 class="pxp-res-t">고르신 조건에 <em>잘 맞는 모니터</em>예요</h3>' +
      '<div class="pxp-cards' + (list.length === 2 ? " is-2" : "") + '">' + cards + '</div>' +
      (anyWave ? accBlock() : '') +
      '<div class="pxp-cta"><button type="button" class="pxp-btn" data-act="again">다시하기</button>' +
      '<button type="button" class="pxp-btn" data-act="more" aria-expanded="false" aria-controls="pxpMore">상세 보기</button></div>' +
      '<div class="pxp-fold" id="pxpMore" inert><div class="pxp-fold-in"><div class="pxp-more">' +
      '<div class="pxp-more-s"><div class="pxp-more-t">고르신 조건</div><div class="pxp-chips">' + chips + '</div></div>' +
      '<div class="pxp-more-s"><dl class="pxp-dl">' + detail + '</dl></div></div></div></div>' +
      '<p class="pxp-foot">제품 선택을 돕기 위한 참고용 안내입니다. 가격과 자세한 사양은 제품 페이지에서 확인해 주세요.</p></div>';

    $("pxpStage").innerHTML = h;
    bindShots($("pxpStage"));
    $("pxpStage").querySelector('[data-act="again"]').addEventListener("click", function () { swap(function () { hardReset(); renderQ(); }); });
    var mb = $("pxpStage").querySelector('[data-act="more"]');
    mb.addEventListener("click", function () {
      var open = mb.getAttribute("aria-expanded") !== "true", p = $("pxpMore");
      mb.setAttribute("aria-expanded", open ? "true" : "false");
      mb.textContent = open ? "상세 닫기" : "상세 보기";
      p.classList.toggle("is-open", open);
      if (open) p.removeAttribute("inert"); else p.setAttribute("inert", "");
    });
    state.ans = blank();                 // 결과 산출 즉시 응답 초기화 (저장하지 않음)
  }

  function hardReset() {
    clearTimers();
    state.step = 0; state.ans = blank(); state.busy = false;
    $("pxpTitle").innerHTML = HEAD.t; $("pxpSub").textContent = HEAD.s;
    $("pxpHead").classList.remove("is-result");
  }
  function open()  { hardReset(); renderQ(); $("pxpOverlay").classList.add("is-open"); document.body.style.overflow = "hidden"; }
  function close() { clearTimers(); state.busy = false; state.ans = blank(); $("pxpOverlay").classList.remove("is-open"); document.body.style.overflow = ""; }

  function init() {
    $("pxpClose").addEventListener("click", close);
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape" || !$("pxpOverlay").classList.contains("is-open")) return;
      if ($("pxpStage").querySelector(".pxp-res")) return;     // 결과 화면은 Esc 로 닫지 않습니다
      close();
    });
    document.querySelectorAll(".pxp-trigger").forEach(function (b) { b.addEventListener("click", open); });
    var AUTO_OPEN = false;               // true 로 바꾸면 3초 뒤 자동 노출
    if (AUTO_OPEN) setTimeout(open, 3000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();

  return { open:open, close:close, _recommend:recommend, _models:MODELS, _flow:flow };
})();
</script>
<!-- ▲ 여기까지 복사 -->
</body>
</html>
